<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <!-- Tło naklejki na pojemnik komunalny -->
  <rect width="600" height="800" rx="24" fill="#ffffff" stroke="#1b7a3e" stroke-width="8"/>
  
  <!-- Górny pas ekologiczny -->
  <path d="M 0 24 C 0 10.7 10.7 0 24 0 L 576 0 C 589.3 0 600 10.7 600 24 L 600 130 L 0 130 Z" fill="#1b7a3e"/>
  
  <!-- Tytuł naklejki -->
  <text x="300" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">ELWOZ ECO SmartCare</text>
  <text x="300" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#e8f5e9" text-anchor="middle">CYFROWY PUNKT OBSŁUGI MIESZKAŃCA</text>
  <text x="300" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#c8e6c9" text-anchor="middle">Gmina Kartuzy • Zgłaszanie nieprawidłowości i harmonogram</text>

  <!-- Hasło główne -->
  <text x="300" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#143d59" text-anchor="middle">ZESKANUJ KOD TELEFONEM</text>
  <text x="300" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" fill="#555555" text-anchor="middle">Brak konieczności instalowania aplikacji i logowania!</text>

  <!-- Ramka na Kod QR -->
  <rect x="150" y="240" width="300" height="300" rx="16" fill="#f8faf9" stroke="#2e9b53" stroke-width="3" stroke-dasharray="6 6"/>
  
  <!-- Podgląd / Placeholder na wygenerowany kod QR -->
  <g transform="translate(165, 255)">
    <rect width="270" height="270" fill="#ffffff" rx="10"/>
    <!-- Centralny sygnet SmartCare w ramce QR -->
    <circle cx="135" cy="135" r="40" fill="#e8f5e9" stroke="#1b7a3e" stroke-width="2"/>
    <text x="135" y="130" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#1b7a3e" text-anchor="middle">MIEJSCE NA KOD QR</text>
    <text x="135" y="148" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#143d59" text-anchor="middle">GitHub Pages URL</text>
  </g>

  <!-- Kafelki korzyści dla mieszkańca -->
  <g transform="translate(60, 560)">
    <!-- Kafel 1 -->
    <rect x="0" y="0" width="150" height="85" rx="10" fill="#e8f5e9" stroke="#c8e6c9"/>
    <text x="75" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" text-anchor="middle">🚛</text>
    <text x="75" y="55" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#1b5e20" text-anchor="middle">Brak odbioru?</text>
    <text x="75" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#2e7d32" text-anchor="middle">Zgłoś w 30 sekund</text>

    <!-- Kafel 2 -->
    <rect x="165" y="0" width="150" height="85" rx="10" fill="#e3f2fd" stroke="#bbdefb"/>
    <text x="240" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" text-anchor="middle">🗑️</text>
    <text x="240" y="55" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#0d47a1" text-anchor="middle">Pęknięty kubeł?</text>
    <text x="240" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#1565c0" text-anchor="middle">Zamów wymianę</text>

    <!-- Kafel 3 -->
    <rect x="330" y="0" width="150" height="85" rx="10" fill="#fef3c7" stroke="#fde68a"/>
    <text x="405" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" text-anchor="middle">📅</text>
    <text x="405" y="55" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">Harmonogram</text>
    <text x="405" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#b45309" text-anchor="middle">Terminy wywozu</text>
  </g>

  <!-- Pasek informacyjny / POK Kartuzy -->
  <rect x="50" y="665" width="500" height="50" rx="8" fill="#f1f5f9"/>
  <text x="300" y="686" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#1e293b" text-anchor="middle">Punkt Obsługi Klienta: ul. Mściwoja II 14, Kartuzy • Tel. 58 681 22 99</text>
  <text x="300" y="702" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Oficjalna witryna: elwozeco.pl • Portal odpadowy: odpady.kartuzy.pl</text>

  <!-- Stopka edukacyjna -->
  <text x="300" y="750" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#94a3b8" text-anchor="middle">PROJEKT STUDENCKI – UNIWERSYTET WSB MERITO W GDAŃSKU</text>
  <text x="300" y="765" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Projekt wdrożeniowy w ramach przedmiotu „Nowoczesne technologie w marketingu i sprzedaży”</text>
</svg>