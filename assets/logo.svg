<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" width="360" height="80">
  <defs>
    <linearGradient id="ecoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e9b53" />
      <stop offset="100%" stop-color="#145a32" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1976d2" />
      <stop offset="100%" stop-color="#0d47a1" />
    </linearGradient>
  </defs>
  
  <!-- Sygnet / Ikona ekologiczna -->
  <g transform="translate(10, 10)">
    <!-- Tło tarczy/liścia -->
    <circle cx="30" cy="30" r="28" fill="#e8f5e9" stroke="#2e9b53" stroke-width="2"/>
    <!-- Stylizowany liść z pętlą recyklingu -->
    <path d="M 30 14 C 20 22 18 34 26 44 C 32 38 38 32 42 22 C 38 18 34 15 30 14 Z" fill="url(#ecoGrad)"/>
    <path d="M 22 36 C 24 44 32 46 38 42 C 34 38 28 36 22 36 Z" fill="url(#blueGrad)"/>
    <circle cx="21" cy="23" r="3.5" fill="#2e9b53"/>
  </g>

  <!-- Napis ELWOZ ECO -->
  <text x="82" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="900" fill="#145a32" letter-spacing="1">ELWOZ <tspan fill="#2e9b53">ECO</tspan></text>
  
  <!-- Sub-brand SmartCare -->
  <text x="82" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0d47a1" letter-spacing="0.5">SmartCare <tspan font-weight="400" font-size="11" fill="#555555">| Punkt Mieszkańca</tspan></text>
  
  <!-- Oznaczenie prototypu -->
  <rect x="82" y="62" width="130" height="14" rx="3" fill="#e3f2fd"/>
  <text x="86" y="73" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#1565c0">PROTOTYP STUDENCKI</text>
</svg>