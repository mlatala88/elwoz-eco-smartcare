              </div>
            </div>
          </div>

          <!-- PANEL PRAWY: STATUS, ZARZĄDZANIE, SLA I KOLEJNY KROK -->
          <div class="detail-panel">
            <div class="detail-panel-header">
              <span>Zarządzanie sprawą & SLA</span>
              <i data-lucide="settings" style="width: 16px; height: 16px; color: var(--brand-navy);"></i>
            </div>
            <div class="detail-panel-body">

              <!-- Karta SLA -->
              <div class="sla-timer-card ${isOverdue ? 'overdue' : 'ok'}">
                <div>
                  <div class="sla-label">Licznik SLA 1. reakcji</div>
                  <div class="sla-value">${slaDisplay}</div>
                </div>
                <i data-lucide="${isOverdue ? 'alert-triangle' : 'shield-check'}" 
                   style="width: 22px; height: 22px; color: ${isOverdue ? 'var(--prio-urgent)' : 'var(--brand-green)'};"></i>
              </div>

              <!-- Status i Priorytet -->
              <div class="form-group">
                <label class="form-label form-label-required">Status sprawy</label>
                <select class="form-select" id="detail-status">
                  <option value="Nowe" ${this.ticket.status === 'Nowe' ? 'selected' : ''}>Nowe</option>
                  <option value="Do weryfikacji" ${this.ticket.status === 'Do weryfikacji' ? 'selected' : ''}>Do weryfikacji</option>
                  <option value="W realizacji" ${this.ticket.status === 'W realizacji' ? 'selected' : ''}>W realizacji</option>
                  <option value="Oczekuje na informacje" ${this.ticket.status === 'Oczekuje na informacje' ? 'selected' : ''}>Oczekuje na informacje</option>
                  <option value="Rozwiązane" ${this.ticket.status === 'Rozwiązane' ? 'selected' : ''}>Rozwiązane</option>
                  <option value="Zamknięte" ${this.ticket.status === 'Zamknięte' ? 'selected' : ''}>Zamknięte</option>
                </select>
              </div>

              <div class="form-group">
                <label class="form-label form-label-required">Zatwierdzony priorytet</label>
                <select class="form-select" id="detail-priority">
                  <option value="PILNY" ${this.ticket.priority === 'PILNY' ? 'selected' : ''}>PILNY (15 min reakcja / 4h)</option>
                  <option value="WYSOKI" ${this.ticket.priority === 'WYSOKI' ? 'selected' : ''}>WYSOKI (2h reakcja / 24h)</option>
                  <option value="STANDARDOWY" ${this.ticket.priority === 'STANDARDOWY' ? 'selected' : ''}>STANDARDOWY (4h reakcja / 48h)</option>
                  <option value="NISKI" ${this.ticket.priority === 'NISKI' ? 'selected' : ''}>NISKI (24h reakcja / 72h)</option>
                </select>
              </div>

              <div class="form-group">
                <label class="form-label form-label-required">Pracownik odpowiedzialny</label>
                <select class="form-select" id="detail-assignee">
                  <option value="Nieprzypisany">Nieprzypisany</option>
                  ${this.staffList.map(s => `<option value="${s.name}" ${this.ticket.assignee === s.name ? 'selected' : ''}>${s.name} (${s.role})</option>`).join("")}
                </select>
              </div>

              <!-- Kolejny krok (Wymóg operacyjny) -->
              <div class="form-group">
                <label class="form-label form-label-required">Następne działanie (Kolejny krok)</label>
                <textarea class="form-control" id="detail-next-action" rows="2" 
                          placeholder="np. Weryfikacja zapisu kamer trasy...">${this.ticket.nextAction || ''}</textarea>
                ${!this.ticket.nextAction && !isClosed ? `
                  <div class="warning-no-step" style="margin-top: 6px;">
                    <i data-lucide="alert-octagon" style="width: 14px; height: 14px; flex-shrink: 0;"></i>
                    <span>Uwaga: Sprawa otwarta bez określonego kolejnego kroku!</span>
                  </div>
                ` : ''}
              </div>

              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div class="form-group">
                  <label class="form-label">Strona odpowiedzialna</label>
                  <select class="form-select" id="detail-responsible-side">
                    <option value="Przedsiębiorstwo" ${this.ticket.responsibleSide === 'Przedsiębiorstwo' ? 'selected' : ''}>Przedsiębiorstwo</option>
                    <option value="Mieszkaniec" ${this.ticket.responsibleSide === 'Mieszkaniec' ? 'selected' : ''}>Mieszkaniec</option>
                  </select>
                </div>

                <div class="form-group">
                  <label class="form-label">Termin działania</label>
                  <input type="datetime-local" class="form-control" id="detail-next-deadline" 
                         value="${this.ticket.nextActionDeadline ? this.ticket.nextActionDeadline.replace(' ', 'T') : ''}" />
                </div>
              </div>

              <!-- Potwierdzenie sposobu rozwiązania sprawy (wymagane przy zamykaniu) -->
              <div class="form-group" id="resolution-method-group" style="display: ${isClosed ? 'block' : 'none'};">
                <label class="form-label form-label-required">Rzeczywisty sposób rozwiązania sprawy</label>
                <textarea class="form-control" id="detail-resolution-method" rows="2" 
                          placeholder="Opisz konkretne działania wykonane przez firmę...">${this.ticket.resolutionMethod || ''}</textarea>
                <span class="form-hint">Zgodnie ze standardem CX, nie wolno zamknąć sprawy bez opisu wykonanych działań.</span>
              </div>

              <!-- Notatka wewnętrzna pracownika -->
              <div class="form-group">
                <label class="form-label">Notatki wewnętrzne (Poufne)</label>
                <textarea class="form-control" id="detail-employee-note" rows="3" 
                          placeholder="Wpisz wewnętrzne ustalenia, nr tachografu, kontakt z dyspozytornią...">${this.ticket.employeeNote || ''}</textarea>
              </div>

              <!-- Przycisk zapisu zmian -->
              <button class="btn btn-navy btn-sm" id="btn-save-ticket-details" style="width: 100%; margin-top: 8px;">
                <i data-lucide="save" style="width: 15px; height: 15px;"></i>
                <span>Zapisz zmiany w sprawie</span>
              </button>
            </div>
          </div>

        </div>
      </div>
    `;

    this.bindEvents(prevTicket, nextTicket);

    if (window.lucide) {
      window.lucide.createIcons({ root: this.container });
    }
  }

  renderMiniComms() {
    if (!this.communications || this.communications.length === 0) {
      return `<div style="font-size: 11px; color: var(--text-muted); font-style: italic;">Brak zarejestrowanej korespondencji.</div>`;
    }

    return this.communications.map(c => `
      <div style="background-color: var(--bg-muted); border: 1px solid var(--border-light); border-radius: var(--radius-sm); padding: 8px; font-size: 11px;">
        <div style="display: flex; justify-content: space-between; font-weight: 600; color: var(--brand-navy);">
          <span>${c.actionType} (${c.channel})</span>
          <span style="font-weight: normal; color: var(--text-secondary);">${c.timestamp.substring(11, 16)}</span>
        </div>
        <div style="color: var(--text-secondary); margin-top: 2px;">Odbiorca: ${c.recipient} • Przez: ${c.author}</div>
      </div>
    `).join("");
  }

  bindEvents(prevTicket, nextTicket) {
    const backBtn = this.container.querySelector("#btn-detail-back");
    if (backBtn) backBtn.onclick = () => this.router.navigate("tickets");

    const prevBtn = this.container.querySelector("#btn-prev-ticket");
    if (prevBtn && prevTicket) prevBtn.onclick = () => this.router.navigate("detail", { id: prevTicket.id });

    const nextBtn = this.container.querySelector("#btn-next-ticket");
    if (nextBtn && nextTicket) nextBtn.onclick = () => this.router.navigate("detail", { id: nextTicket.id });

    // Zmiana statusu dynamicznie pokazuje pole rozwiązania
    const statusSelect = this.container.querySelector("#detail-status");
    const resMethodGroup = this.container.querySelector("#resolution-method-group");
    statusSelect.onchange = () => {
      if (statusSelect.value === "Rozwiązane" || statusSelect.value === "Zamknięte") {
        resMethodGroup.style.display = "block";
      } else {
        resMethodGroup.style.display = "none";
      }
    };

    // Auto-rozszerzanie pola kolejnego działania
    const nextActionEl = this.container.querySelector("#detail-next-action");
    if (nextActionEl) {
      const autoExpand = () => {
        nextActionEl.style.height = "auto";
        nextActionEl.style.height = (nextActionEl.scrollHeight) + "px";
      };
      nextActionEl.addEventListener("input", autoExpand);
      setTimeout(autoExpand, 50);
    }

    // Obsługa menu "Więcej szablonów"
    const moreToggleBtn = this.container.querySelector("#btn-toggle-more-templates");
    const moreMenu = this.container.querySelector("#more-templates-dropdown");
    if (moreToggleBtn && moreMenu) {
      moreToggleBtn.onclick = (e) => {
        e.stopPropagation();
        moreMenu.style.display = moreMenu.style.display === "none" ? "flex" : "none";
      };
      document.addEventListener("click", () => {
        if (moreMenu) moreMenu.style.display = "none";
      }, { once: false });
    }

    // Szablony wiadomości
    const currentUserName = this.state.currentUser ? this.state.currentUser.name : "Anna Nowak";
    const templates = {
      confirm: `Dzień dobry,\n\nDziękujemy za kontakt z Punktem Obsługi Klienta ELWOZ ECO w Kartuzach.\nPotwierdzamy zarejestrowanie zgłoszenia nr ${this.ticket.id} dotyczącego: ${this.ticket.type} (${this.ticket.fraction}) pod adresem: ${this.ticket.city}, ul. ${this.ticket.street} ${this.ticket.houseNumber || ''}.\n\nZgłoszenie zostało zarejestrowane i przekazane do weryfikacji. O kolejnych krokach poinformujemy w odrębnej wiadomości.\n\nZ poważaniem,\n${currentUserName}\nPunkt Obsługi Klienta Kartuzy\nELWOZ ECO Sp. z o.o.\ntel. 58 681 22 99 | kontakt@example.com`,
      missing: `Dzień dobry,\n\nDziękujemy za kontakt z POK Kartuzy w sprawie zgłoszenia nr ${this.ticket.id}.\n\nAbyśmy mogli skierować załogę bezpośrednio pod Państwa nieruchomość i szybko zrealizować usługę, uprzejmie prosimy o doprecyzowanie brakujących danych (dokładny numer posesji lub frakcja odpadów).\n\nOdpowiedź można przesłać zwrotnie na tę wiadomość lub przekazać telefonicznie pod numerem 58 681 22 99.\n\nZ poważaniem,\n${currentUserName}\nPOK Kartuzy\nELWOZ ECO Sp. z o.o.`,
      progress: `Dzień dobry,\n\nInformujemy o postępach w obsłudze zgłoszenia nr ${this.ticket.id}.\nPodjęto następujące działania: zweryfikowano zgłoszenie oraz zaplanowano realizację zadania (${this.ticket.nextAction || 'weryfikacja w terenie'}).\n\nPrzewidywany termin realizacji: ${this.ticket.nextActionDeadline || 'w najbliższy dzień roboczy'}.\n\nZ poważaniem,\n${currentUserName}\nPOK Kartuzy\nELWOZ ECO Sp. z o.o.`,
      resolved: `Dzień dobry,\n\nInformujemy, że zgłoszenie nr ${this.ticket.id} dotyczące adresu ${this.ticket.city}, ul. ${this.ticket.street} ${this.ticket.houseNumber || ''} zostało pomyślnie zrealizowane.\n\nWykonane działania: ${this.ticket.resolutionMethod || '[Opis wykonanych działań]'}\n\nDziękujemy za wyrozumiałość i współpracę.\n\nZ poważaniem,\n${currentUserName}\nELWOZ ECO Sp. z o.o.`,
      thanks: `Dzień dobry,\n\nSerdecznie dziękujemy za kontakt z Punktem Obsługi Klienta ELWOZ ECO w Kartuzach oraz za przekazane słowa podziękowania.\n\nPaństwa opinia została przekazana pracownikom bazy w Kartuzach. Takie sygnały są dla całego zespołu motywacją do codziennej rzetelnej pracy na rzecz czystości naszego regionu.\n\nZ poważaniem,\n${currentUserName}\nPOK Kartuzy\nELWOZ ECO Sp. z o.o.`,
      review: `Dzień dobry,\n\nDziękujemy za współpracę z ELWOZ ECO w ramach obsługi zgłoszenia nr ${this.ticket.id}.\n\nZależy nam na ciągłym podnoszeniu jakości naszych usług komunalnych. Będziemy niezwykle wdzięczni za poświęcenie minuty na podzielenie się swoją opinią o obsłudze:\nhttps://search.google.com/local/writereview?placeid=ChIJ13yCwGSa_UYRqkDdyWL8wdA\n\nKażda szczera opinia pomaga nam lepiej dopasować usługi do potrzeb mieszkańców.\n\nZ poważaniem,\nZespół Obsługi Klienta ELWOZ ECO`,
      google_review: `Dzień dobry,\n\nDziękujemy za kontakt z Punktem Obsługi Klienta ELWOZ ECO w Kartuzach w sprawie zgłoszenia nr ${this.ticket.id}.\n\nBędziemy bardzo wdzięczni za wystawienie oceny w profilu Google naszej firmy:\nhttps://search.google.com/local/writereview?placeid=ChIJ13yCwGSa_UYRqkDdyWL8wdA\n\nZ poważaniem,\nZespół Obsługi Klienta ELWOZ ECO`,
      refusal_pszok: `Dzień dobry,\n\nDziękujemy za kontakt z Punktem Obsługi Klienta ELWOZ ECO w Kartuzach w sprawie zgłoszenia nr ${this.ticket.id}.\n\nUprzejmie informujemy, że wskazany odbiór nie może zostać zrealizowany w ramach standardowego odbioru odpadów. Szczegółowych informacji o możliwości zagospodarowania odpadów udziela Punkt Obsługi Klienta oraz PSZOK w Kartuzach.\n\nZachęcamy do kontaktu telefonicznego pod numerem 58 681 22 99 w celu omówienia dostępnych rozwiązań.\n\nZ poważaniem,\n${currentUserName}\nPOK Kartuzy\nELWOZ ECO Sp. z o.o.`,
      pszok_info: `Dzień dobry,\n\nInformujemy, że na terenie gminy funkcjonuje Punkt Selektywnej Zbiórki Odpadów Komunalnych (PSZOK) w Kartuzach, przyjmujący określone frakcje odpadów od mieszkańców.\n\nAby uzyskać aktualne informacje dotyczące zasad przyjmowania odpadów oraz bieżących godzin otwarcia punktu, zapraszamy do kontaktu z Punktem Obsługi Klienta pod numerem telefonu 58 681 22 99.\n\nZ poważaniem,\nZespół POK Kartuzy\nELWOZ ECO Sp. z o.o.`
    };

    const applyTemplate = (key) => {
      if (templates[key]) {
        this.container.querySelector("#msg-content").value = templates[key];
        if (key === "review" || key === "google_review") {
          this.container.querySelector("#msg-subject").value = `Podziel się swoją opinią o obsłudze zgłoszenia ${this.ticket.id} – ELWOZ ECO`;
        } else if (key === "resolved") {
          this.container.querySelector("#msg-subject").value = `Informacja o rozwiązaniu zgłoszenia ${this.ticket.id} – POK Kartuzy`;
        } else if (key === "confirm") {
          this.container.querySelector("#msg-subject").value = `Potwierdzenie przyjęcia zgłoszenia ${this.ticket.id} – POK Kartuzy`;
        } else if (key === "refusal_pszok") {
          this.container.querySelector("#msg-subject").value = `Informacja w sprawie zgłoszenia ${this.ticket.id} – POK Kartuzy`;
        }
      }
    };

    const templatePills = this.container.querySelectorAll(".template-pill");
    templatePills.forEach(pill => {
      pill.onclick = () => {
        const key = pill.getAttribute("data-template");
        applyTemplate(key);
      };
    });

    const moreButtons = this.container.querySelectorAll(".more-tmpl-btn");
    moreButtons.forEach(btn => {
      btn.onclick = () => {
        const key = btn.getAttribute("data-template");
        applyTemplate(key);
        if (moreMenu) moreMenu.style.display = "none";
      };
    });

    // Przycisk Usprawnij z AI
    const polishBtn = this.container.querySelector("#btn-polish-ai");
    polishBtn.onclick = async () => {
      const contentEl = this.container.querySelector("#msg-content");
      const rawText = contentEl.value;
      if (!rawText.trim()) {
        Promise.resolve({ Toast }).then(({ Toast }) => Toast.warning("Wpisz treść wiadomości przed usprawnieniem."));
        return;
      }

      polishBtn.disabled = true;
      polishBtn.innerHTML = `<span>⏳ AI analizuje i poprawia styl...</span>`;

      try {
        const polished = await this.dataProvider.polishMessageWithAi(rawText, { 
          ticket: this.ticket,
          staffName: currentUserName
        });
        contentEl.value = polished;
        Promise.resolve({ Toast }).then(({ Toast }) => {
          Toast.success("AI poprawiło styl wiadomości zgodnie ze standardami CX/PR.");
        });
      } catch (err) {
        Promise.resolve({ Toast }).then(({ Toast }) => {
          Toast.warning(err.message || "Błąd stylizacji AI.");
        });
      } finally {
        polishBtn.disabled = false;
        polishBtn.innerHTML = `
          <i data-lucide="wand-2" style="width: 12px; height: 12px;"></i>
          <span>✨ Usprawnij styl z AI (CX/PR)</span>
        `;
        if (window.lucide) window.lucide.createIcons({ root: polishBtn });
      }
    };

    // Wysłanie wiadomości (z Pre-Send Guardrail)
    const sendBtn = this.container.querySelector("#btn-send-message");
    sendBtn.onclick = async () => {
      const recipient = this.container.querySelector("#msg-recipient").value.trim();
      const channel = this.container.querySelector("#msg-channel").value;
      const subject = this.container.querySelector("#msg-subject").value.trim();
      const content = this.container.querySelector("#msg-content").value.trim();

      if (!recipient) {
        Promise.resolve({ Toast }).then(({ Toast }) => Toast.warning("Wprowadź adresata wiadomości."));
        return;
      }
      if (!content) {
        Promise.resolve({ Toast }).then(({ Toast }) => Toast.warning("Treść wiadomości nie może być pusta."));
        return;
      }

      // Pre-Send Quality Control Guardrail (bezwarunkowa kontrola przed wysyłką tematu i treści)
      const fullMessageText = `${subject} ${content}`;
      const quality = evaluateMessageQuality(fullMessageText);
      if (!quality.isValid) {
        Promise.resolve({ Toast }).then(({ Toast }) => {
          Toast.error(quality.blockedReason || "Wiadomość nie spełnia standardów komunikacji z mieszkańcem (CX/PR). Popraw treść lub skorzystaj z asystenta AI.");
        });
        return;
      }

      // Blokada wysłania komunikatu o rozwiązaniu sprawy, jeśli opis podjętych działań zawiera placeholdery lub jest pusty/za krótki
      const isResolutionNotice = subject.includes("rozwiązani") || subject.includes("zrealizowan");
      if (isResolutionNotice) {
        const placeholderRegex = /\[(opis|wpisz|wstaw|uzupełnij).*?\]/i;
        if (placeholderRegex.test(content) || placeholderRegex.test(subject)) {
          Promise.resolve({ Toast }).then(({ Toast }) => {
            Toast.error("Błąd: Wiadomość o rozwiązaniu zawiera tekst zastępczy (placeholder). Podaj faktyczny opis wykonanych działań.");
          });
          return;
        }
        if (content.length < 30) {
          Promise.resolve({ Toast }).then(({ Toast }) => {
            Toast.error("Błąd: Opis wykonanych działań w wiadomości o rozwiązaniu sprawy jest zbyt krótki (<30 znaków).");
          });
          return;
        }
      }

      const commData = {
        ticketId: this.ticket.id,
        recipient,
        channel,
        subject,
        content,
        author: currentUserName,
        actionType: subject.includes("Potwierdzenie") ? "Potwierdzenie przyjęcia" : (subject.includes("opini") ? "Zaproszenie do opinii Google" : (isResolutionNotice ? "Informacja o rozwiązaniu" : "Odpowiedź do mieszkańca")),
        status: "Wysłano"
      };

      try {
        await this.dataProvider.addCommunication(commData);
        Promise.resolve({ Toast }).then(({ Toast }) => {
          Toast.success(`Wysłano wiadomość do: ${recipient} (Testowy odbiorca: wsb.student.tester@gmail.com)`);
        });
      } catch (err) {
        Promise.resolve({ Toast }).then(({ Toast }) => {
          Toast.error(err.message || "Błąd wysyłki wiadomości.");
        });
        return;
      }

      // Odśwież widok
      this.render({ id: this.ticket.id });
    };

    // Odnotowanie telefonu
    const logCallBtn = this.container.querySelector("#btn-log-call");
    logCallBtn.onclick = () => {
      Promise.resolve({ Modal }).then(({ Modal }) => {
        const modal = new Modal({
          title: "Odnotuj rozmowę telefoniczną z mieszkańcem",
          size: "md",
          content: `
            <div class="form-group">
              <label class="form-label form-label-required">Numer telefonu rozmówcy</label>
              <input type="text" class="form-control" id="call-phone" value="${this.ticket.applicantPhone || ''}" placeholder="+48..." />
            </div>
            <div class="form-group">
              <label class="form-label form-label-required">Wynik rozmowy</label>
              <select class="form-select" id="call-result">
                <option value="Potwierdzono szczegóły sprawy i termin">Potwierdzono szczegóły sprawy i termin</option>
                <option value="Uzyskano brakujący numer posesji">Uzyskano brakujący numer posesji</option>
                <option value="Mieszkaniec poinformowany o rozwiązaniu">Mieszkaniec poinformowany o rozwiązaniu</option>
                <option value="Nie odebrano – wysłano SMS">Nie odebrano – wysłano SMS</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label form-label-required">Notatka z przebiegu rozmowy</label>
              <textarea class="form-control" id="call-notes" rows="4" placeholder="Wpisz kluczowe ustalenia z mieszkańcem..."></textarea>
            </div>
          `,
          footer: `
            <button class="btn btn-secondary btn-sm" id="btn-call-cancel">Anuluj</button>
            <button class="btn btn-primary btn-sm" id="btn-call-save">Zapisz rozmowę w historii</button>
          `
        });

        modal.element.querySelector("#btn-call-cancel").onclick = () => modal.close();
        modal.element.querySelector("#btn-call-save").onclick = async () => {
          const phone = modal.element.querySelector("#call-phone").value.trim();
          const result = modal.element.querySelector("#call-result").value;
          const notes = modal.element.querySelector("#call-notes").value.trim();

          if (!notes) {
            Promise.resolve({ Toast }).then(({ Toast }) => Toast.warning("Wpisz notatkę z rozmowy."));
            return;
          }

          const commData = {
            ticketId: this.ticket.id,
            recipient: phone || "Mieszkaniec",
            channel: "Telefon",
            subject: `Rozmowa telefoniczna – ${result}`,
            content: `Wynik: ${result}\nNotatka: ${notes}`,
            author: this.state.currentUser ? this.state.currentUser.name : "Anna Nowak",
            actionType: "Rozmowa telefoniczna",
            status: "Odnotowano"
          };

          await this.dataProvider.addCommunication(commData);
          await this.dataProvider.updateTicket(this.ticket.id, {
            contactResult: result
          });

          modal.close();
          Promise.resolve({ Toast }).then(({ Toast }) => {
            Toast.success("Odnotowano rozmowę telefoniczną w historii sprawy.");
          });
          this.render({ id: this.ticket.id });
        };

        modal.open();
      });
    };

    // Zapis zmian w prawym panelu
    const saveBtn = this.container.querySelector("#btn-save-ticket-details");
    saveBtn.onclick = async () => {
      const newStatus = this.container.querySelector("#detail-status").value;
      const newPriority = this.container.querySelector("#detail-priority").value;
      const newAssignee = this.container.querySelector("#detail-assignee").value;
      const newNextAction = this.container.querySelector("#detail-next-action").value.trim();
      const newSide = this.container.querySelector("#detail-responsible-side").value;
      const newDeadlineRaw = this.container.querySelector("#detail-next-deadline").value;
      const newDeadline = newDeadlineRaw ? newDeadlineRaw.replace("T", " ") : "";
      const newNote = this.container.querySelector("#detail-employee-note").value.trim();
      const resolutionMethod = this.container.querySelector("#detail-resolution-method").value.trim();

      // Walidacja zamykania zgłoszenia (wymóg z promptu i testy.md TEST-07)
      const isClosing = newStatus === "Rozwiązane" || newStatus === "Zamknięte";
      if (isClosing) {
        if (!resolutionMethod || resolutionMethod.length < 5) {
          Promise.resolve({ Toast }).then(({ Toast }) => {
            Toast.error("Błąd: Przed oznaczeniem sprawy jako rozwiązana lub zamknięta musisz wpisać rzeczywisty sposób rozwiązania sprawy (minimum 5 znaków).");
          });
          this.container.querySelector("#detail-resolution-method").focus();
          return;
        }

        const placeholderRegex = /\[(opis|wpisz|wstaw|uzupełnij).*?\]/i;
        if (placeholderRegex.test(resolutionMethod)) {
          Promise.resolve({ Toast }).then(({ Toast }) => {
            Toast.error("Błąd: Sposób rozwiązania sprawy zawiera tekst zastępczy (placeholder). Podaj rzeczywiste ustalenia.");
          });
          this.container.querySelector("#detail-resolution-method").focus();
          return;
        }
      }

      // Ostrzeżenie przy braku kolejnego kroku w otwartej sprawie
      if (!isClosing && !newNextAction) {
        Promise.resolve({ Toast }).then(({ Toast }) => {
          Toast.warning("Uwaga: Sprawa otwarta bez określonego kolejnego kroku!");
        });
      }

      const updates = {
        status: newStatus,
        priority: newPriority,
        assignee: newAssignee,
        nextAction: newNextAction,
        responsibleSide: newSide,
        nextActionDeadline: newDeadline,
        employeeNote: newNote
      };

      if (isClosing) {
        updates.resolutionMethod = resolutionMethod;
      }

      await this.dataProvider.updateTicket(this.ticket.id, updates);
      Promise.resolve({ Toast }).then(({ Toast }) => {
        Toast.success(`Pomyślnie zaktualizowano sprawę ${this.ticket.id}.`);
      });

      this.render({ id: this.ticket.id });
    };
  }
}

/**
 * ELWOZ ECO SmartCare Manager v0.3.0
 * Communications View (Komunikacja – Centralny Dziennik Korespondencji)
 */

class CommsView {
  constructor(container, router, dataProvider, state) {
    this.container = container;
    this.router = router;
    this.dataProvider = dataProvider;
    this.state = state;
    this.filterChannel = "all";
    this.searchQuery = "";
  }

  async render() {
    this.container.innerHTML = `
      <div class="view-header">
        <div class="view-title-group">
          <h1 class="view-title">Komunikacja z mieszkańcami</h1>
          <div class="view-description">Centralny rejestr korespondencji e-mail, notatek z rozmów telefonicznych oraz zaproszeń do opinii</div>
        </div>
      </div>

      <!-- Filtry dziennika -->
      <div class="card" style="margin-bottom: 16px; padding: 14px 16px;">
        <div style="display: grid; grid-template-columns: 2fr 1fr auto; gap: 12px; align-items: end;">
          <div class="form-group" style="margin-bottom: 0;">
            <label class="form-label">Szukaj w korespondencji</label>
            <div class="input-group">
              <i data-lucide="search" class="input-icon" style="width: 15px; height: 15px;"></i>
              <input type="text" id="comms-search" class="form-control input-with-icon" 
                     placeholder="Szukaj po ID zgłoszenia, odbiorcy, temacie lub treści..." value="${this.searchQuery}" />
            </div>
          </div>

          <div class="form-group" style="margin-bottom: 0;">
            <label class="form-label">Kanał kontaktu</label>
            <select class="form-select" id="comms-channel">
              <option value="all">Wszystkie kanały</option>
              <option value="E-mail">E-mail</option>
              <option value="Telefon">Telefon</option>
              <option value="Notatka wewnętrzna">Notatka wewnętrzna</option>
            </select>
          </div>

          <button class="btn btn-secondary btn-sm" id="btn-comms-reset" style="height: 38px;">
            <i data-lucide="rotate-ccw" style="width: 14px; height: 14px;"></i>
            <span>Wyczyść</span>
          </button>
        </div>
      </div>

      <!-- Tabela korespondencji -->
      <div class="table-container">
        <table class="data-table">
          <thead>
            <tr>
              <th>Data i godzina</th>
              <th>Nr zgłoszenia</th>
              <th>Rodzaj działania</th>
              <th>Kanał</th>
              <th>Odbiorca</th>
              <th>Temat wiadomości</th>
              <th>Treść (Podgląd)</th>
              <th>Pracownik</th>
              <th>Status</th>
              <th style="text-align: right;">Akcja</th>
            </tr>
          </thead>
          <tbody id="comms-table-body">
            <tr><td colspan="10" style="text-align: center; padding: 24px;">Ładowanie dziennika...</td></tr>
          </tbody>
        </table>
      </div>
    `;

    this.bindEvents();
    await this.loadComms();

    if (window.lucide) {
      window.lucide.createIcons({ root: this.container });
    }
  }

  bindEvents() {
    const searchInput = this.container.querySelector("#comms-search");
    let debounce;
    searchInput.oninput = () => {
      clearTimeout(debounce);
      debounce = setTimeout(() => {
        this.searchQuery = searchInput.value.trim().toLowerCase();
        this.loadComms();
      }, 300);
    };

    const channelSelect = this.container.querySelector("#comms-channel");
    channelSelect.onchange = () => {
      this.filterChannel = channelSelect.value;
      this.loadComms();
    };

    const resetBtn = this.container.querySelector("#btn-comms-reset");
    resetBtn.onclick = () => {
      this.searchQuery = "";
      this.filterChannel = "all";
      this.render();
    };
  }

  async loadComms() {
    let comms = await this.dataProvider.getCommunications();

    if (this.filterChannel !== "all") {
      comms = comms.filter(c => c.channel === this.filterChannel);
    }

    if (this.searchQuery) {
      const q = this.searchQuery;
      comms = comms.filter(c => 
        (c.ticketId && c.ticketId.toLowerCase().includes(q)) ||
        (c.recipient && c.recipient.toLowerCase().includes(q)) ||
        (c.subject && c.subject.toLowerCase().includes(q)) ||
        (c.content && c.content.toLowerCase().includes(q)) ||
        (c.author && c.author.toLowerCase().includes(q))
      );
    }

    const tbody = this.container.querySelector("#comms-table-body");
    if (comms.length === 0) {
      tbody.innerHTML = `
        <tr>
          <td colspan="10">
            <div class="empty-state">
              <i data-lucide="message-square" class="empty-state-icon"></i>
              <div class="empty-state-title">Brak wpisów w dzienniku</div>
              <div class="empty-state-desc">Nie zarejestrowano korespondencji spełniającej kryteria.</div>
            </div>
          </td>
        </tr>
      `;
      if (window.lucide) window.lucide.createIcons({ root: tbody });
      return;
    }

    tbody.innerHTML = comms.map(c => `
      <tr>
        <td style="font-size: 12px; white-space: nowrap; color: var(--text-secondary);">${c.timestamp}</td>
        <td>
          <a href="#" class="table-ticket-id link-ticket" data-ticket-id="${c.ticketId}">${c.ticketId}</a>
        </td>
        <td style="font-weight: 600; font-size: 12px;">${c.actionType}</td>
        <td>
          <span class="badge ${c.channel === 'E-mail' ? 'badge-status-nowe' : (c.channel === 'Telefon' ? 'badge-prio-wysoki' : 'badge-status-progress')}">
            ${c.channel}
          </span>
        </td>
        <td style="font-size: 12px; word-break: break-all;">${c.recipient}</td>
        <td style="font-weight: 500; font-size: 12px; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
          ${c.subject || '-'}
        </td>
        <td style="max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; color: var(--text-secondary);">
          ${c.content}
        </td>
        <td style="font-size: 12px;">${c.author}</td>
        <td>
          <span class="badge ${c.status === 'Wysłano' ? 'badge-status-rozwiazane' : (c.status === 'Odnotowano' ? 'badge-ai-przeanalizowano' : 'badge-status-waiting')}">
            ${c.status}
          </span>
        </td>
        <td style="text-align: right; white-space: nowrap;">
          <button class="btn btn-secondary btn-xs btn-view-full-msg" data-comm-id="${c.id}">Podgląd</button>
        </td>
      </tr>
    `).join("");

    tbody.querySelectorAll(".link-ticket").forEach(link => {
      link.onclick = (e) => {
        e.preventDefault();
        const tid = link.getAttribute("data-ticket-id");
        this.router.navigate("detail", { id: tid });
      };
    });

    tbody.querySelectorAll(".btn-view-full-msg").forEach(btn => {
      btn.onclick = () => {
        const cid = btn.getAttribute("data-comm-id");
        const found = comms.find(c => c.id === cid);
        if (found) this.showFullMessageModal(found);
      };
    });
  }

  showFullMessageModal(c) {
    Promise.resolve({ Modal }).then(({ Modal }) => {
      const modal = new Modal({
        title: `Podgląd korespondencji – ${c.actionType}`,
        size: "md",
        content: `
          <div style="display: flex; flex-direction: column; gap: 12px; font-size: 13px;">
            <div style="display: grid; grid-template-columns: 100px 1fr; gap: 8px;">
              <span style="font-weight: 600; color: var(--text-secondary);">Zgłoszenie:</span>
              <span class="table-ticket-id">${c.ticketId}</span>

              <span style="font-weight: 600; color: var(--text-secondary);">Data wysyłki:</span>
              <span>${c.timestamp}</span>

              <span style="font-weight: 600; color: var(--text-secondary);">Kanał:</span>
              <span>${c.channel}</span>

              <span style="font-weight: 600; color: var(--text-secondary);">Odbiorca:</span>
              <span>${c.recipient}</span>

              <span style="font-weight: 600; color: var(--text-secondary);">Pracownik:</span>
              <span>${c.author}</span>

              <span style="font-weight: 600; color: var(--text-secondary);">Temat:</span>
              <span style="font-weight: 600;">${c.subject || '-'}</span>
            </div>

            <div style="margin-top: 8px;">
              <div style="font-weight: 600; color: var(--text-secondary); margin-bottom: 6px;">Pełna treść wiadomości:</div>
              <div style="background-color: var(--bg-muted); border: 1px solid var(--border-color); border-radius: var(--radius-sm); padding: 14px; white-space: pre-wrap; font-size: 13px; line-height: 1.5;">${c.content}</div>
            </div>
          </div>
        `,
        footer: `
          <button class="btn btn-navy btn-sm" id="btn-close-msg-preview">Zamknij</button>
        `
      });

      modal.element.querySelector("#btn-close-msg-preview").onclick = () => modal.close();
      modal.open();
    });
  }
}

          </div>

          </div>
          <div class="kpi-hint">Oceny 1–2 ★ (Niezadowolenie)</div>

          </div>

        </div>
      </div>

      <div class="card" style="margin-bottom: 20px; border-left: 4px solid var(--brand-green); background-color: #F8FBF6;">
        <div class="card-body" style="padding: 14px 18px;">
          <div style="display: flex; align-items: flex-start; gap: 14px;">
            <i data-lucide="shield-check" style="width: 24px; height: 24px; color: var(--brand-green); flex-shrink: 0; margin-top: 2px;"></i>
            <div>
              <div style="font-weight: 700; font-size: 14px; color: var(--brand-green-dark); margin-bottom: 4px;">
                Standard etyczny Google Reviews w ELWOZ ECO SmartCare
              </div>
              <div style="font-size: 13px; color: var(--text-primary); line-height: 1.5;">
                Zgodnie z regulacjami prawnymi i polityką Google: zaproszenia do wystawienia opinii są <strong>bezwzględnie neutralne</strong> (nie sugerują liczby gwiazdek, nie obiecują nagród ani korzyści materialnych, nie filtrują niezadowolonych klientów i nie publikują fikcyjnych opinii).
              </div>
              <div style="margin-top: 8px;">
                <a href="https://search.google.com/local/writereview?placeid=ChIJ13yCwGSa_UYRqkDdyWL8wdA" 
                   target="_blank" rel="noopener noreferrer" 
                   class="btn btn-outline btn-xs" style="text-decoration: none;">
                  <i data-lucide="external-link" style="width: 12px; height: 12px;"></i>
                  <span>Zweryfikowany link wizytówki POK Kartuzy</span>
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Dwie kolumny: Rozkład ocen i Pilny ponowny kontakt -->
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px;">
        <!-- Rozkład ocen -->
        <div class="card">
          <div class="card-header">
            <div class="card-title">
              <i data-lucide="bar-chart-2" style="width: 16px; height: 16px;"></i>
              <span>Rozkład ocen od 1 do 5 gwiazdek</span>
            </div>
          </div>
          <div class="card-body" id="csat-bars-body">
            <!-- Paski rozkładu -->
          </div>
        </div>

        <!-- Sprawy wymagające ponownego kontaktu -->
        <div class="card" style="border-color: var(--prio-urgent-border);">
          <div class="card-header" style="background-color: var(--prio-urgent-bg);">
            <div class="card-title" style="color: var(--prio-urgent);">
              <i data-lucide="alert-circle" style="width: 16px; height: 16px;"></i>
              <span>Sprawy z niską oceną (Wymagające ponownego kontaktu)</span>
            </div>
          </div>
          <div class="card-body" id="low-csat-list" style="padding: 12px; max-height: 280px; overflow-y: auto;">
            <!-- Lista spraw z ocenami 1-2 -->
          </div>
        </div>
      </div>

      <!-- Tabela zebranych opinii i komentarzy -->
      <div class="card">
        <div class="card-header">
          <div class="card-title">
            <i data-lucide="message-circle" style="width: 16px; height: 16px;"></i>
            <span>Rejestr komentarzy i uwag mieszkańców</span>
          </div>
        </div>
        <div class="table-container" style="border: none; border-radius: 0;">
          <table class="data-table">
            <thead>
              <tr>
                <th>ID Zgłoszenia</th>
                <th>Miejscowość</th>
                <th>Kategoria</th>
                <th>Ocena</th>
                <th>Komentarz mieszkańca</th>
                <th>Opinia Google</th>
                <th>Data rozwiązania</th>
                <th style="text-align: right;">Akcja</th>
              </tr>
            </thead>
            <tbody id="csat-comments-tbody">

          </table>

      </div>

    }
  }

  async loadCsatData() {
    const stats = await this.dataProvider.getStats("all");
    const tickets = await this.dataProvider.getTickets();

    // Uzupełnienie kafelków KPI
    const avgEl = this.container.querySelector("#csat-avg-val");
    if (avgEl) avgEl.textContent = stats.avgSatisfactionFormatted !== "-" ? `${stats.avgSatisfactionFormatted} ★` : "-";

    const countEl = this.container.querySelector("#csat-count-val");
    if (countEl) countEl.textContent = stats.feedbackCount;

    const lowRatedTickets = tickets.filter(t => t.satisfactionScore != null && t.satisfactionScore <= 2);
    const lowCountEl = this.container.querySelector("#csat-low-count-val");
    if (lowCountEl) lowCountEl.textContent = lowRatedTickets.length;

    const revCountEl = this.container.querySelector("#csat-reviews-count-val");
    if (revCountEl) revCountEl.textContent = stats.reviewInvitesCount;

    // Paski rozkładu ocen
    const barsContainer = this.container.querySelector("#csat-bars-body");
    const totalRated = stats.feedbackCount || 1;
    const scores = [5, 4, 3, 2, 1];

    barsContainer.innerHTML = scores.map(star => {
      const count = stats.csatDistribution[star] || 0;
      const pct = Math.round((count / totalRated) * 100);
      let barColor = "var(--brand-green)";
      if (star === 3) barColor = "#FBBF24";
      if (star <= 2) barColor = "var(--prio-urgent)";

      return `
        <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 10px; font-size: 13px;">
          <div style="width: 70px; font-weight: 600;">${star} ★ (${count})</div>
          <div style="flex: 1; height: 16px; background-color: var(--bg-muted); border-radius: 4px; overflow: hidden; border: 1px solid var(--border-color);">
            <div style="width: ${pct}%; height: 100%; background-color: ${barColor}; transition: width 0.3s ease;"></div>
          </div>
          <div style="width: 45px; text-align: right; color: var(--text-secondary); font-size: 12px;">${pct}%</div>
        </div>
      `;
    }).join("");

    // Lista niskich ocen
    const lowListContainer = this.container.querySelector("#low-csat-list");
    if (lowRatedTickets.length === 0) {
      lowListContainer.innerHTML = `<div style="text-align: center; color: var(--text-secondary); padding: 20px;">Brak spraw z niską oceną.</div>`;
    } else {
      lowListContainer.innerHTML = lowRatedTickets.map(t => `
        <div style="background-color: #FFFFFF; border: 1px solid var(--prio-urgent-border); border-radius: var(--radius-sm); padding: 10px 12px; margin-bottom: 8px;">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <a href="#" class="table-ticket-id link-ticket" data-ticket-id="${t.id}">${t.id}</a>
            <span class="badge badge-prio-pilny">${t.satisfactionScore} ★</span>
          </div>
          <div style="font-size: 12px; color: var(--text-primary); margin: 4px 0; font-style: italic;">
            "${t.citizenFeedback || 'Brak komentarza tekstowego'}"
          </div>
          <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 6px;">
            <span style="font-size: 11px; color: var(--text-secondary);">${t.applicantName} (${t.city})</span>
            <button class="btn btn-navy btn-xs btn-open-ticket" data-ticket-id="${t.id}">Obsłuż sprawę</button>
          </div>
        </div>
      `).join("");
    }

    // Tabela opinii
    const ratedTickets = tickets.filter(t => t.satisfactionScore != null);
    const tbody = this.container.querySelector("#csat-comments-tbody");
    if (ratedTickets.length === 0) {
      tbody.innerHTML = `<tr><td colspan="8" style="text-align: center; padding: 20px;">Brak zarejestrowanych ocen.</td></tr>`;
      return;
    }

    tbody.innerHTML = ratedTickets.map(t => `
      <tr>
        <td class="table-ticket-id">${t.id}</td>
        <td>${t.city}</td>
        <td>${t.type}</td>
        <td>
          <span class="badge ${t.satisfactionScore >= 4 ? 'badge-status-rozwiazane' : (t.satisfactionScore === 3 ? 'badge-status-do-weryfikacji' : 'badge-prio-pilny')}">
            ${t.satisfactionScore} ★
          </span>
        </td>
        <td style="max-width: 320px; font-size: 12px; color: var(--text-primary);">
          ${t.citizenFeedback ? `„${t.citizenFeedback}”` : '<span style="color: var(--text-muted); font-style: italic;">(Brak uwag tekstowych)</span>'}
        </td>
        <td>
          ${t.reviewInviteSent === 'TAK' 
            ? '<span class="badge badge-status-rozwiazane">Wysłano zaproszenie</span>' 
            : '<span style="font-size: 11px; color: var(--text-secondary);">Nie wysłano</span>'}
        </td>
        <td style="font-size: 12px; color: var(--text-secondary);">${t.resolvedDate || '-'}</td>
        <td style="text-align: right;">
          <button class="btn btn-secondary btn-xs btn-open-ticket" data-ticket-id="${t.id}">Szczegóły</button>
        </td>
      </tr>
    `).join("");

    this.container.querySelectorAll(".btn-open-ticket, .link-ticket").forEach(btn => {
      btn.onclick = (e) => {
        e.preventDefault();
        const tid = btn.getAttribute("data-ticket-id");
        this.router.navigate("detail", { id: tid });
      };
    });
  }
}

/**
 * ELWOZ ECO SmartCare Manager v0.3.0
 * Reports & Analytics View (Raporty i analityka)
 */

class ReportsView {
  constructor(container, router, dataProvider, state) {
    this.container = container;
    this.router = router;

    this.currentPeriod = "all";
  }

  async render() {
    this.container.innerHTML = `
      <div class="view-header">

          <h1 class="view-title">Raporty i analityka operacyjna</h1>

        </div>

          Raport wygenerowany dla danych demonstracyjnych WSB Merito
        </div>

      <!-- Główne KPI Raportu -->
      <div class="kpi-grid" style="grid-template-columns: repeat(6, 1fr); margin-bottom: 24px;" id="rep-kpi-grid">
        <!-- Renderowane dynamicznie -->
      </div>

      <!-- Dwie sekcje tabelaryczne: Obciążenie pracowników oraz Powtarzające się problemy -->
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px;">
        <!-- Obciążenie pracowników -->
        <div class="card">
          <div class="card-header">
            <div class="card-title">
              <i data-lucide="users" style="width: 16px; height: 16px;"></i>
              <span>Obciążenie i efektywność pracowników POK</span>
            </div>
          </div>
          <div class="table-container" style="border: none; border-radius: 0;">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Pracownik</th>
                  <th>Przypisane</th>
                  <th>Rozwiązane</th>
                  <th>W realizacji</th>
                  <th>Skuteczność</th>
                </tr>
              </thead>
              <tbody id="rep-staff-tbody">
                <tr><td colspan="5" style="text-align: center; padding: 16px;">Ładowanie...</td></tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- Najczęstsze problemy i kategorie -->
        <div class="card">
          <div class="card-header">
            <div class="card-title">
              <i data-lucide="layers" style="width: 16px; height: 16px;"></i>
              <span>Najczęściej zgłaszane kategorie problemów</span>
            </div>
          </div>
          <div class="table-container" style="border: none; border-radius: 0;">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Kategoria zgłoszenia</th>
                  <th>Liczba spraw</th>
                  <th>Udział procentowy</th>
                  <th>Wskaźnik rozwiązań</th>
                </tr>
              </thead>
              <tbody id="rep-cat-tbody">
                <tr><td colspan="4" style="text-align: center; padding: 16px;">Ładowanie...</td></tr>
              </tbody>

          </div>

      </div>
    `;

    this.bindEvents();
    await this.loadReportData();

    if (window.lucide) {
      window.lucide.createIcons({ root: this.container });
    }
  }

  bindEvents() {
    const periodBtns = this.container.querySelectorAll("[data-rep-period]");
    periodBtns.forEach(btn => {
      btn.onclick = () => {
        periodBtns.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        this.currentPeriod = btn.getAttribute("data-rep-period");
        this.loadReportData();
      };
    });

    const exportBtn = this.container.querySelector("#btn-export-reports-csv");
    exportBtn.onclick = () => this.exportCsv();
  }

  async loadReportData() {
    const stats = await this.dataProvider.getStats(this.currentPeriod);
    const tickets = await this.dataProvider.getTickets();
    const staffList = await this.dataProvider.getStaff();

    // KPI grid
    const kpiGrid = this.container.querySelector("#rep-kpi-grid");
    kpiGrid.innerHTML = `
      <div class="kpi-card">
        <div class="kpi-header"><span class="kpi-title">Nowe sprawy</span></div>
        <div class="kpi-value">${stats.newCount}</div>
        <div class="kpi-hint">Wpłynęły w okresie</div>
      </div>
      <div class="kpi-card kpi-success">
        <div class="kpi-header"><span class="kpi-title">Sprawy rozwiązane</span></div>
        <div class="kpi-value">${stats.resolved}</div>
        <div class="kpi-hint">Zakończone pomyślnie</div>
      </div>
      <div class="kpi-card kpi-success">
        <div class="kpi-header"><span class="kpi-title">Odsetek rozwiązań</span></div>
        <div class="kpi-value">${stats.resolutionRate !== '-' ? stats.resolutionRate + '%' : '-'}</div>
        <div class="kpi-hint">Wskaźnik finalizacji</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-header"><span class="kpi-title">Śr. czas 1. reakcji</span></div>
        <div class="kpi-value">${stats.avgFirstResponseFormatted}</div>
        <div class="kpi-hint">Odpowiedź do klienta</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-header"><span class="kpi-title">Śr. czas rozwiązania</span></div>
        <div class="kpi-value">${stats.avgResolutionFormatted}</div>
        <div class="kpi-hint">Czas cyklu sprawy</div>
      </div>
      <div class="kpi-card kpi-success">
        <div class="kpi-header"><span class="kpi-title">Średnia satysfakcja</span></div>
        <div class="kpi-value">${stats.avgSatisfactionFormatted !== '-' ? stats.avgSatisfactionFormatted + ' ★' : '-'}</div>
        <div class="kpi-hint">${stats.feedbackCount} ankiet powrotnych</div>
      </div>
    `;

    // Tabela pracowników
    const isClosed = s => s === "Rozwiązane" || s === "Zamknięte";
    const staffTbody = this.container.querySelector("#rep-staff-tbody");
    const staffRows = staffList.map(s => {
      const assigned = tickets.filter(t => t.assignee === s.name);
      const res = assigned.filter(t => isClosed(t.status));
      const inProg = assigned.filter(t => !isClosed(t.status));
      const rate = assigned.length > 0 ? ((res.length / assigned.length) * 100).toFixed(0) + "%" : "-";

      return `
        <tr>
          <td>
            <div style="font-weight: 600;">${s.name}</div>
            <div style="font-size: 11px; color: var(--text-secondary);">${s.role}</div>
          </td>
          <td style="font-weight: 600;">${assigned.length}</td>
          <td style="color: var(--brand-green); font-weight: 600;">${res.length}</td>
          <td>${inProg.length}</td>
          <td><span class="badge badge-status-rozwiazane">${rate}</span></td>
        </tr>
      `;
    });
    staffTbody.innerHTML = staffRows.join("");

    // Tabela kategorii
    const catTbody = this.container.querySelector("#rep-cat-tbody");
    const total = stats.total || 1;
    const catEntries = Object.entries(stats.categoryMap).sort((a, b) => b[1] - a[1]);

    catTbody.innerHTML = catEntries.map(([cat, count]) => {
      const pct = ((count / total) * 100).toFixed(1);
      const resolvedCount = tickets.filter(t => t.type === cat && isClosed(t.status)).length;
      const resRate = count > 0 ? ((resolvedCount / count) * 100).toFixed(0) + "%" : "-";

      return `
        <tr>
          <td style="font-weight: 600;">${cat}</td>
          <td>${count}</td>
          <td>
            <div style="display: flex; align-items: center; gap: 8px;">
              <div style="flex: 1; height: 6px; background-color: var(--bg-muted); border-radius: 3px; overflow: hidden;">
                <div style="width: ${pct}%; height: 100%; background-color: var(--brand-navy);"></div>
              </div>
              <span style="font-size: 11px; color: var(--text-secondary); width: 35px;">${pct}%</span>
            </div>
          </td>
          <td><span class="badge badge-ai-przeanalizowano">${resRate}</span></td>
        </tr>
      `;
    }).join("");
  }

  async exportCsv() {
    const stats = await this.dataProvider.getStats(this.currentPeriod);
    const tickets = await this.dataProvider.getTickets();

    const headers = ["Wskaznik / Kategoria", "Wartosc", "Opis"];
    const rows = [
      ["Wszystkie zgloszenia w okresie", stats.total, "Laczna liczba zgloszen"],
      ["Zgloszenia rozwiazane", stats.resolved, "Liczba spraw ze statusem Rozwiazane"],
      ["Wskaznik rozwiazan", stats.resolutionRate + "%", "Odsetek zakonczonych sukcesem"],
      ["Sredni czas 1. reakcji", stats.avgFirstResponseFormatted, "Czas od zgloszenia do kontaktu"],
      ["Sredni czas rozwiazania", stats.avgResolutionFormatted, "Pelny cykl obslugi"],
      ["Srednia ocena satysfakcji", stats.avgSatisfactionFormatted, "Skala 1-5 gwiazdek"],
      ["Liczba opinii Google", stats.reviewInvitesCount, "Wyslane zaproszenia"]
    ];

    Object.entries(stats.categoryMap).forEach(([k, v]) => {
      rows.push([`Kategoria: ${k}`, v, "Liczba zgloszen w kategorii"]);
    });

    const disclaimer = "# RAPORT ANALITYCZNY - ELWOZ ECO SMARTCARE MANAGER V0.3.0 (DANE DEMONSTRACYJNE)\n";
    const csvContent = disclaimer + [headers.join(";")].concat(rows.map(r => r.join(";"))).join("\r\n");

    const blob = new Blob(["\uFEFF" + csvContent], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `elwoz-smartcare-raport-${this.currentPeriod}-${new Date().toISOString().split("T")[0]}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    Promise.resolve({ Toast }).then(({ Toast }) => {
      Toast.success("Pomyślnie wygenerowano i pobrano plik CSV z raportem.");
    });
  }
}

        </div>

        <div class="kpi-card" id="card-status-ai">
          <div class="kpi-header"><span class="kpi-title">Gemini API (Silnik AI)</span><i data-lucide="cpu" class="kpi-icon"></i></div>
          <div class="kpi-value-row"><div class="kpi-value" style="font-size: 20px;" id="val-ai-status">Łączenie...</div></div>
          <div class="kpi-hint" id="hint-ai-model">gemini-3.6-flash</div>
        </div>

        <div class="kpi-card" id="card-status-latency">
          <div class="kpi-header"><span class="kpi-title">Średnie opóźnienie</span><i data-lucide="zap" class="kpi-icon"></i></div>
          <div class="kpi-value-row"><div class="kpi-value" id="val-latency">- ms</div></div>
          <div class="kpi-hint">Czas odpowiedzi warstwy danych</div>
        </div>

        <div class="kpi-card" id="card-status-errors">
          <div class="kpi-header"><span class="kpi-title">Błędy operacyjne</span><i data-lucide="alert-triangle" class="kpi-icon"></i></div>
          <div class="kpi-value-row"><div class="kpi-value" id="val-errors-count">0</div></div>
          <div class="kpi-hint" id="hint-errors-desc">Walidacja i komunikacja</div>
        </div>
      </div>

      <!-- Tryb symulacji błędów dla testów akceptacyjnych -->

        <div class="card-body" style="padding: 16px 20px;">
          <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;">
            <div>
              <div style="font-weight: 700; font-size: 14px; color: var(--text-primary); margin-bottom: 4px;">
                Symulator awarii i limitów API (Narzędzie testowe QA)
              </div>
              <div style="font-size: 13px; color: var(--text-secondary); max-width: 650px;">
                Umożliwia zasymulowanie błędu limitu quota (HTTP 429 / 503) w Gemini API w celu zweryfikowania odporności interfejsu (brak zamykania okna dialogowego, czytelny komunikat błędu, możliwość ponowienia próby zgodnie ze scenariuszami TEST-12 i TEST-18).

              <i data-lucide="toggle-left" id="icon-sim-toggle" style="width: 16px; height: 16px;"></i>

      <!-- Wyniki ostatniego testu diagnostycznego -->
      <div class="card" style="margin-bottom: 20px;" id="diag-results-card">
        <div class="card-header">
          <div class="card-title">
            <i data-lucide="check-circle" style="width: 16px; height: 16px; color: var(--brand-green);"></i>
            <span>Wyniki automatycznego pakietu diagnostycznego</span>
          </div>
          <span style="font-size: 12px; color: var(--text-secondary);" id="diag-last-run-time">-</span>
        </div>
        <div class="table-container" style="border: none; border-radius: 0;">
          <table class="data-table">
            <thead>
              <tr>
                <th>Testowany komponent / reguła</th>
                <th>Status testu</th>
                <th>Czas odpowiedzi</th>
                <th>Szczegóły weryfikacji</th>
              </tr>
            </thead>
            <tbody id="diag-test-tbody">
              <tr><td colspan="4" style="text-align: center; padding: 16px;">Kliknij „Uruchom test diagnostyczny API”, aby zainicjować procedurę.</td></tr>
            </tbody>
          </table>

      </div>

      <!-- Karta specyfikacji technicznej środowiska -->
      <div class="card">
        <div class="card-header">
          <div class="card-title">
            <i data-lucide="info" style="width: 16px; height: 16px;"></i>
            <span>Metadane i architektura wersji demonstracyjnej v0.3.0</span>
          </div>
        </div>
        <div class="card-body" style="font-size: 13px; line-height: 1.6;">
          <div style="display: grid; grid-template-columns: 220px 1fr; gap: 8px; margin-bottom: 12px;">
            <span style="font-weight: 600; color: var(--text-secondary);">Wersja aplikacji:</span>
            <span>ELWOZ ECO SmartCare Manager v0.3.0-demo (WSB Merito)</span>

            <span style="font-weight: 600; color: var(--text-secondary);">Warstwa dostępu do danych:</span>
            <span>DemoDataProvider (izolacja interfejsu, adapter gotowy na AppsScriptDataProvider)</span>

            <span style="font-weight: 600; color: var(--text-secondary);">Model językowy AI:</span>
            <span>Gemini 3.6 Flash (Structured Outputs, 10 pól schematu, filtr thought)</span>

            <span style="font-weight: 600; color: var(--text-secondary);">Format bazy CRM:</span>
            <span>43 kolumny CSI zgodne ze strukturą Google Sheets v0.2.7/v0.2.8</span>

            <span style="font-weight: 600; color: var(--text-secondary);">Zabezpieczenie przed wyciekiem:</span>
            <span>Twardy filtr PII (anonimizacja ulic i nazwisk przed modelem AI)</span>
          </div>
          <div style="padding: 10px; background-color: var(--bg-muted); border-radius: var(--radius-sm); border: 1px solid var(--border-color); font-size: 12px; color: var(--text-secondary);">

        </div>
      </div>
    `;

    this.bindEvents();
    await this.loadDiagnostics();

    if (window.lucide) {
      window.lucide.createIcons({ root: this.container });
    }
  }

  bindEvents() {
    const runBtn = this.container.querySelector("#btn-run-diag-test");
    runBtn.onclick = async () => {
      runBtn.disabled = true;
      runBtn.innerHTML = `<span>⏳ Uruchamianie testów...</span>`;

      const results = await this.dataProvider.runDiagnosticsTest();
      this.renderTestResults(results);

      runBtn.disabled = false;
      runBtn.innerHTML = `
        <i data-lucide="play" style="width: 14px; height: 14px;"></i>
        <span>Uruchom test diagnostyczny API</span>
      `;
      if (window.lucide) window.lucide.createIcons({ root: runBtn });

      Promise.resolve({ Toast }).then(({ Toast }) => {
        Toast.success("Pakiet testów diagnostycznych zakończony pomyślnie.");
      });
    };

    const syncBtn = this.container.querySelector("#btn-sync-now");
    syncBtn.onclick = async () => {
      syncBtn.disabled = true;
      syncBtn.innerHTML = `<span>Synchronizacja...</span>`;
      await new Promise(r => setTimeout(r, 600));
      await this.loadDiagnostics();
      syncBtn.disabled = false;
      syncBtn.innerHTML = `
        <i data-lucide="refresh-cw" style="width: 14px; height: 14px;"></i>
        <span>Wymuś synchronizację</span>
      `;
      if (window.lucide) window.lucide.createIcons({ root: syncBtn });
      Promise.resolve({ Toast }).then(({ Toast }) => {
        Toast.success("Zsynchronizowano stan telemetrii.");
      });
    };

    const toggleSimBtn = this.container.querySelector("#btn-toggle-sim-error");
    toggleSimBtn.onclick = async () => {
      const updated = await this.dataProvider.toggleSimulatedError();
      await this.loadDiagnostics();
      Promise.resolve({ Toast }).then(({ Toast }) => {
        if (updated.simulatedErrorMode) {
          Toast.warning("Włączono symulację błędu Gemini API (HTTP 503).");
        } else {
          Toast.success("Wyłączono symulację błędu – Gemini API działa normalnie.");
        }
      });
    };
  }

  async loadDiagnostics() {
    const diag = await this.dataProvider.getDiagnostics();

    const dbStatus = this.container.querySelector("#val-db-status");
    if (dbStatus) {
      dbStatus.textContent = diag.sheetsConnection;
      dbStatus.style.color = diag.sheetsConnection === "OK" ? "var(--brand-green)" : "var(--prio-urgent)";
    }

    const aiStatus = this.container.querySelector("#val-ai-status");
    if (aiStatus) {
      aiStatus.textContent = diag.simulatedErrorMode ? "Błąd symulowany" : "Dostępne";
      aiStatus.style.color = diag.simulatedErrorMode ? "var(--prio-urgent)" : "var(--brand-green)";
    }

    const latencyEl = this.container.querySelector("#val-latency");
    if (latencyEl) latencyEl.textContent = `${diag.latencyMs} ms`;

    const errorsEl = this.container.querySelector("#val-errors-count");
    if (errorsEl) {
      const totalErrors = diag.aiErrors + diag.commErrors + diag.validationIssues;
      errorsEl.textContent = totalErrors;
      errorsEl.style.color = totalErrors > 0 ? "var(--prio-high)" : "var(--brand-green)";
    }

    const toggleText = this.container.querySelector("#text-sim-toggle");
    const toggleIcon = this.container.querySelector("#icon-sim-toggle");
    if (toggleText && toggleIcon) {
      if (diag.simulatedErrorMode) {
        toggleText.textContent = "Wyłącz symulację błędu (Przywróć stan OK)";
        toggleIcon.setAttribute("data-lucide", "toggle-right");
        toggleIcon.style.color = "var(--prio-urgent)";
      } else {
        toggleText.textContent = "Włącz symulację błędu Gemini API";
        toggleIcon.setAttribute("data-lucide", "toggle-left");
        toggleIcon.style.color = "";
      }
    }
  }

  renderTestResults(res) {
    const lastRunEl = this.container.querySelector("#diag-last-run-time");
    if (lastRunEl) lastRunEl.textContent = `Wykonano: ${res.timestamp}`;

    const tbody = this.container.querySelector("#diag-test-tbody");
    tbody.innerHTML = res.tests.map(t => `
      <tr>
        <td style="font-weight: 600;">${t.name}</td>
        <td>
          <span class="badge ${t.status === 'PASSED' ? 'badge-status-rozwiazane' : 'badge-prio-pilny'}">
            ${t.status === 'PASSED' ? '✓ ZALICZONY' : '✗ BŁĄD'}
          </span>
        </td>
        <td style="font-family: monospace; font-size: 12px;">${t.latency}</td>
        <td style="font-size: 12px; color: var(--text-secondary);">
          ${t.status === 'PASSED' ? 'Parametry w normie operacyjnej' : 'Wykryto symulowaną awarię komponentu'}
        </td>
      </tr>
    `).join("");
  }
}

/**

class SettingsView {

  bindEvents() {
    const modeSelect = this.container.querySelector("#set-app-mode");
    const endpointInput = this.container.querySelector("#set-gas-endpoint");
    const endpointGroup = this.container.querySelector("#group-gas-endpoint");

    if (modeSelect) {
      modeSelect.onchange = () => {
        const selected = modeSelect.value;
        if (endpointGroup) endpointGroup.style.display = selected === "connected" ? "block" : "none";
        if (typeof localStorage !== "undefined") {
          localStorage.setItem("smartcare_mode", selected);
        }
        Promise.resolve({ Toast }).then(({ Toast }) => {
          Toast.info(`Zmieniono tryb na: ${selected === 'connected' ? 'CONNECTED' : 'DEMO'}. Przeładowywanie...`);
        });
        setTimeout(() => {
          if (typeof window !== "undefined") window.location.reload();
        }, 800);
      };
    }

    if (endpointInput) {
      endpointInput.onchange = () => {
        if (typeof localStorage !== "undefined") {
          localStorage.setItem("smartcare_gas_endpoint", endpointInput.value.trim());
        }
      };
    }

    const resetBtn = this.container.querySelector("#btn-reset-demo-factory");
    if (resetBtn) {
      resetBtn.onclick = () => {
        Promise.resolve({ Modal }).then(({ Modal }) => {
          Modal.confirm(
            "Czy na pewno chcesz przywrócić fabryczny zbiór danych demonstracyjnych?<br><br>Wszystkie lokalne zmiany, dodane zgłoszenia i edycje zostaną cofnięte do stanu początkowego (30 zweryfikowanych zgłoszeń testowych).",
            async () => {
              await this.dataProvider.resetDemoData();
              Promise.resolve({ Toast }).then(({ Toast }) => {
                Toast.success("Przywrócono fabryczny zbiór danych demonstracyjnych.");
              });
              this.router.navigate("dashboard");
            },
            "Przywracanie danych demonstracyjnych",
            "Przywróć dane",
            "Anuluj",
            true
          );
        });
      };
    }

    const saveBtn = this.container.querySelector("#btn-save-settings");
    saveBtn.onclick = async () => {
      const allowKeysEl = this.container.querySelector("#set-allow-employee-keys");
      const updatedSettings = {
        ...this.settings,
        companyName: this.container.querySelector("#set-company").value.trim(),
        branch: this.container.querySelector("#set-branch").value.trim(),
        email: this.container.querySelector("#set-email").value.trim(),
        phone: this.container.querySelector("#set-phone").value.trim(),
        workingHours: this.container.querySelector("#set-hours").value.trim(),
        googleReviewUrl: this.container.querySelector("#set-google-url").value.trim(),
        allowEmployeeApiKeys: allowKeysEl ? allowKeysEl.checked : false
      };

      await this.dataProvider.updateSettings(updatedSettings);
      Promise.resolve({ Toast }).then(({ Toast }) => {
        Toast.success("Zapisano ustawienia systemowe.");
      });
    };

    const addStaffBtn = this.container.querySelector("#btn-add-staff");
    addStaffBtn.onclick = () => {
      Promise.resolve({ Modal }).then(({ Modal }) => {
        const modal = new Modal({
          title: "Dodaj nowego pracownika do POK",
          size: "sm",
          content: `
            <div class="form-group">
              <label class="form-label form-label-required">Imię i nazwisko</label>
              <input type="text" class="form-control" id="staff-new-name" placeholder="np. Janina Kowalczyk" />
            </div>
            <div class="form-group">
              <label class="form-label form-label-required">Rola / Stanowisko</label>
              <input type="text" class="form-control" id="staff-new-role" placeholder="np. Młodszy Dyspozytor" />
            </div>
            <div class="form-group">
              <label class="form-label form-label-required">Adres e-mail</label>
              <input type="email" class="form-control" id="staff-new-email" placeholder="j.kowalczyk@example.com" />
            </div>
          `,
          footer: `
            <button class="btn btn-secondary btn-sm" id="btn-cancel-staff">Anuluj</button>
            <button class="btn btn-primary btn-sm" id="btn-save-new-staff">Zapisz</button>
          `
        });

        modal.element.querySelector("#btn-cancel-staff").onclick = () => modal.close();
        modal.element.querySelector("#btn-save-new-staff").onclick = async () => {
          const name = modal.element.querySelector("#staff-new-name").value.trim();
          const role = modal.element.querySelector("#staff-new-role").value.trim();
          const email = modal.element.querySelector("#staff-new-email").value.trim();

          if (!name || !role || !email) {
            Promise.resolve({ Toast }).then(({ Toast }) => Toast.warning("Wypełnij wszystkie pola."));
            return;
          }

          const newStaff = {
            id: `staff-${Date.now()}`,
            name,
            role,
            email,
            active: true
          };

          this.staffList.push(newStaff);
          await this.dataProvider.updateStaff(this.staffList);
          modal.close();
          Promise.resolve({ Toast }).then(({ Toast }) => Toast.success(`Dodano pracownika: ${name}`));
          this.render();
        };

        modal.open();
      });
    };
  }
}

/**
 * ELWOZ ECO SmartCare Manager v0.3.0
 * Główny kontroler aplikacji i router SPA
 * 
 * Wspiera dwa tryby działania (Dual Mode Architecture):
 * 1. CONNECTED Mode: Połączony z rzeczywistym silnikiem Google Apps Script CRM (AppsScriptDataProvider),
 *    działa natywnie w Apps Script Web App (google.script.run) lub autoryzowanym REST endpoint.
 * 2. DEMO Mode: Niezależny symulator (30 spraw, LocalStorage, DemoDataProvider),
 *    działa na GitHub Pages oraz lokalnie.
 */
















class App {
  constructor() {
    // 1. Detekcja środowiska uruchomieniowego (GAS Web App vs Local/GitHub Pages)
    const isEmbeddedGas = typeof window !== "undefined" && typeof window.google !== "undefined" && Boolean(window.google.script && window.google.script.run);
    const searchParams = typeof window !== "undefined" && window.location.search ? new URLSearchParams(window.location.search) : new URLSearchParams();
    const paramMode = searchParams.get("mode");
    const storedMode = typeof localStorage !== "undefined" ? localStorage.getItem("smartcare_mode") : null;

    const useConnectedMode = isEmbeddedGas || paramMode === "connected" || storedMode === "connected";

    if (useConnectedMode) {
      const endpoint = searchParams.get("endpoint") || (typeof localStorage !== "undefined" ? localStorage.getItem("smartcare_gas_endpoint") : "");
      this.dataProvider = new AppsScriptDataProvider({ endpointUrl: endpoint });
      this.mode = "connected";
    } else {
      this.dataProvider = new DemoDataProvider();
      this.mode = "demo";
    }

    this.state = {
      currentUser: null,
      currentRoute: "dashboard",
      routeParams: {},
      mode: this.mode,
      isEmbeddedGas: isEmbeddedGas
    };

    this.topbar = null;
    this.sidebar = null;
    this.currentViewInstance = null;
    this.pollingTimer = null;
  }

  async init() {
    // 2. Inicjalizacja tożsamości użytkownika i zespołu POK Kartuzy
    await this.resolveUserIdentity();

    const topbarContainer = document.getElementById("topbar-container");
    const sidebarContainer = document.getElementById("sidebar-container");

    this.sidebar = new Sidebar(sidebarContainer, this, this.dataProvider);
    this.topbar = new Topbar(topbarContainer, this, this.dataProvider, this.state);

    // Subskrypcja zmian w danych dla aktualizacji odznak i wskaźników
    this.dataProvider.subscribe(() => {
      if (this.sidebar) this.sidebar.updateBadges();
      if (this.topbar) {
        this.topbar.loadNotifications();
        this.topbar.updateSystemStatus();
      }
    });

    // 3. Automatyczne odświeżanie danych (polling) z ochroną niezapisanych zmian
    this.startAutoRefreshPolling(30000);

    // 4. Obsługa historii przeglądarki
    window.addEventListener("hashchange", () => this.handleHashChange());
    this.handleHashChange();
  }

  async resolveUserIdentity() {
    try {
      const staffList = await this.dataProvider.getStaff();

      // W trybie CONNECTED sprawdź sesję Google lub zapamiętany PIN
      if (typeof this.dataProvider.checkAuth === "function") {
        try {
          const auth = await this.dataProvider.checkAuth();
          if (auth && auth.authenticated && auth.user) {
            this.state.currentUser = auth.user;
            this.dataProvider.setCurrentUser(auth.user);
            return;
          }
        } catch (_) {}
      }

      // Sprawdź sessionStorage (dla środowiska konsumenckiego @gmail.com)
      if (typeof sessionStorage !== "undefined") {
        const sessionUser = sessionStorage.getItem("smartcare_session_user");
        if (sessionUser) {
          try {
            const parsed = JSON.parse(sessionUser);
            this.state.currentUser = parsed;
            if (typeof this.dataProvider.setCurrentUser === "function") {
              this.dataProvider.setCurrentUser(parsed);
            }
            return;
          } catch (_) {}
        }
      }

      // Domyślny użytkownik (Michał Latała – Administrator)
      this.state.currentUser = (staffList && staffList[0]) || {
        id: "staff-1",
        name: "Michał Latała",
        role: "Administrator",
        email: "wsb.student.tester@gmail.com"
      };

      if (typeof this.dataProvider.setCurrentUser === "function") {
        this.dataProvider.setCurrentUser(this.state.currentUser);
      }

    } catch (e) {
      console.warn("Błąd inicjalizacji tożsamości:", e);
      this.state.currentUser = {
        id: "staff-1",
        name: "Michał Latała",
        role: "Administrator",
        email: "wsb.student.tester@gmail.com"
      };
    }
  }

  startAutoRefreshPolling(intervalMs = 30000) {
    if (this.pollingTimer) clearInterval(this.pollingTimer);

    this.pollingTimer = setInterval(async () => {
      // Ochrona niezapisanych danych:
      // Jeśli pracownik edytuje pole formularza lub modal jest otwarty, nie przeładowuj widoku
      const activeEl = document.activeElement;
      const isUserEditing = activeEl && (
        activeEl.tagName === "INPUT" ||
        activeEl.tagName === "TEXTAREA" ||
        activeEl.tagName === "SELECT" ||
        activeEl.isContentEditable
      );
      const isModalOpen = Boolean(document.querySelector(".modal-backdrop") || document.querySelector(".modal-container"));

      // Aktualizacja wskaźników w tle
      if (this.sidebar) this.sidebar.updateBadges();
      if (this.topbar) {
        this.topbar.loadNotifications();
        this.topbar.updateSystemStatus();
      }

      // Ciche odświeżenie danych widoku wyłącznie gdy pracownik nie wprowadza danych
      if (!isUserEditing && !isModalOpen && this.currentViewInstance) {
        if (typeof this.currentViewInstance.loadData === "function") {
          try {
            await this.currentViewInstance.loadData();
          } catch (_) {}
        }
      }
    }, intervalMs);
  }

  navigate(route, params = {}) {
    let hash = `#${route}`;
    // Bezpieczna serializacja parametrów (unikanie [object Object])
    const cleanParams = {};
    for (const k in params) {
      if (params[k] !== undefined && params[k] !== null) {
        if (typeof params[k] === "object") {
          if (k === "customRange" && params[k].from && params[k].to) {
            cleanParams.from = params[k].from;
            cleanParams.to = params[k].to;
          } else {
            cleanParams[k] = JSON.stringify(params[k]);
          }
        } else {
          cleanParams[k] = String(params[k]);
        }
      }
    }
    const query = new URLSearchParams(cleanParams).toString();
    if (query) hash += `?${query}`;
    window.location.hash = hash;
  }

  refreshCurrent() {
    this.handleHashChange();
  }

  async handleHashChange() {
    let hash = window.location.hash.substring(1) || "dashboard";
    let route = hash;
    let params = {};

    if (hash.includes("?")) {
      const parts = hash.split("?");
      route = parts[0];
      const searchParams = new URLSearchParams(parts[1]);
      for (const [key, value] of searchParams.entries()) {
        params[key] = value;
      }
    }

    this.state.currentRoute = route;
    this.state.routeParams = params;

    if (this.sidebar) this.sidebar.setRoute(route);

    const contentContainer = document.getElementById("content-container");
    contentContainer.scrollTop = 0;

    switch (route) {
      case "dashboard":
        this.currentViewInstance = new DashboardView(contentContainer, this, this.dataProvider, this.state);
        break;
      case "tasks":
        this.currentViewInstance = new TasksView(contentContainer, this, this.dataProvider, this.state);
        break;
      case "tickets":
        this.currentViewInstance = new TicketsView(contentContainer, this, this.dataProvider, this.state);
        break;
      case "detail":
        this.currentViewInstance = new DetailView(contentContainer, this, this.dataProvider, this.state);
        break;
      case "comms":
        this.currentViewInstance = new CommsView(contentContainer, this, this.dataProvider, this.state);
        break;
      case "csat":
        this.currentViewInstance = new CsatView(contentContainer, this, this.dataProvider, this.state);
        break;
      case "reports":
        this.currentViewInstance = new ReportsView(contentContainer, this, this.dataProvider, this.state);
        break;
      case "diagnostics":
        this.currentViewInstance = new DiagnosticsView(contentContainer, this, this.dataProvider, this.state);
        break;
      case "settings":
        this.currentViewInstance = new SettingsView(contentContainer, this, this.dataProvider, this.state);
        break;
      default:
        this.currentViewInstance = new DashboardView(contentContainer, this, this.dataProvider, this.state);
        route = "dashboard";
    }

    await this.currentViewInstance.render(params);

    if (window.lucide) {
      window.lucide.createIcons();
    }
  }
}

// Start aplikacji po załadowaniu DOM
document.addEventListener("DOMContentLoaded", () => {
  const app = new App();
  app.init();
  window.__smartcareApp = app;
});

})();
  </script>
