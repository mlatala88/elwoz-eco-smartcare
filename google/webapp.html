/**
 * ELWOZ ECO SmartCare Manager v0.3.0
 * Accessible Modal Component
 */

class Modal {
  constructor(options = {}) {
    this.title = options.title || "";
    this.content = options.content || "";
    this.footer = options.footer || "";
    this.size = options.size || "md"; // sm, md, lg, xl
    this.onClose = options.onClose || null;
    this.element = null;
    this.render();
  }

  render() {
    this.element = document.createElement("div");
    this.element.className = "modal-backdrop";
    
    let sizeClass = "";
    if (this.size === "lg") sizeClass = "modal-lg";
    if (this.size === "xl") sizeClass = "modal-xl";

    this.element.innerHTML = `
      <div class="modal-dialog ${sizeClass}" role="dialog" aria-modal="true">
        <div class="modal-header">
          <h3 class="modal-title">${this.title}</h3>
          <button class="modal-close-btn" aria-label="Zamknij okno">
            <i data-lucide="x" style="width: 18px; height: 18px;"></i>
          </button>
        </div>
        <div class="modal-body">
          ${typeof this.content === "string" ? this.content : ""}
        </div>
        ${this.footer ? `<div class="modal-footer">${this.footer}</div>` : ""}
      </div>
    `;

    if (typeof this.content !== "string" && this.content instanceof HTMLElement) {
      this.element.querySelector(".modal-body").appendChild(this.content);
    }

    const closeBtn = this.element.querySelector(".modal-close-btn");
    closeBtn.onclick = () => this.close();

    this.element.onclick = (e) => {
      if (e.target === this.element) this.close();
    };

    document.body.appendChild(this.element);

    if (window.lucide) {
      window.lucide.createIcons({ root: this.element });
    }
  }

  open() {
    requestAnimationFrame(() => {
      this.element.classList.add("open");
    });
  }

  close() {
    this.element.classList.remove("open");
    setTimeout(() => {
      if (this.element && this.element.parentElement) {
        this.element.remove();
      }
      if (typeof this.onClose === "function") {
        this.onClose();
      }
    }, 200);
  }

  static confirm(message, onConfirm, title = "Potwierdzenie operacji", confirmText = "Potwierdź", cancelText = "Anuluj", isDanger = false) {
    const modal = new Modal({
      title,
      size: "sm",
      content: `<p style="font-size: 14px; line-height: 1.5; color: var(--text-primary);">${message}</p>`,
      footer: `
        <button class="btn btn-secondary btn-sm" id="modal-cancel-btn">${cancelText}</button>
        <button class="btn ${isDanger ? 'btn-danger' : 'btn-primary'} btn-sm" id="modal-confirm-btn">${confirmText}</button>
      `
    });

    const confirmBtn = modal.element.querySelector("#modal-confirm-btn");
    const cancelBtn = modal.element.querySelector("#modal-cancel-btn");

    confirmBtn.onclick = () => {
      modal.close();
      onConfirm();
    };

    cancelBtn.onclick = () => modal.close();

    modal.open();
    return modal;
  }
}

      };
    });

    if (window.lucide) {
      window.lucide.createIcons({ root: this.container });
    }

    this.updateBadges();
  }
}

/**
 * ELWOZ ECO SmartCare Manager v0.3.0
 * Topbar Component
 */

class Topbar {
  constructor(container, router, dataProvider, state) {
    this.container = container;
    this.router = router;
    this.dataProvider = dataProvider;
    this.state = state;
    this.notifOpen = false;
    this.staffList = [];
    this.render();
  }

  async loadStaff() {
    this.staffList = await this.dataProvider.getStaff();
    this.renderStaffSelector();
  }

  renderStaffSelector() {
    const userRoleEl = this.container.querySelector("#topbar-user-role");
    const userNameEl = this.container.querySelector("#topbar-user-name");
    const userAvatarEl = this.container.querySelector("#topbar-user-avatar");

    const currentStaff = this.state.currentUser || this.staffList[0] || { name: "Anna Nowak", role: "Dyspozytor Główny" };

    if (userNameEl) userNameEl.textContent = currentStaff.name;
    if (userRoleEl) userRoleEl.textContent = currentStaff.role;
    if (userAvatarEl) {
      const initials = currentStaff.name.split(" ").map(n => n[0]).join("");
      userAvatarEl.textContent = initials;
    }
  }

  async loadNotifications() {
    try {
      const tickets = await this.dataProvider.getTickets();
      const now = new Date();
      const isClosed = s => s === "Rozwiązane" || s === "Zamknięte";
      const isOverdue = t => (t.slaDeadline && new Date(t.slaDeadline) < now) || (t.nextActionDeadline && new Date(t.nextActionDeadline) < now);
      const urgentOrOverdue = tickets.filter(t => !isClosed(t.status) && (t.priority === "PILNY" || isOverdue(t))).slice(0, 5);

      const notifBadge = this.container.querySelector("#notif-badge");
      const notifList = this.container.querySelector("#notif-list");

      if (notifBadge) {
        notifBadge.textContent = urgentOrOverdue.length;
        notifBadge.style.display = urgentOrOverdue.length > 0 ? "inline-block" : "none";
      }

      if (notifList) {
        if (urgentOrOverdue.length === 0) {
          notifList.innerHTML = `<div style="padding: 16px; text-align: center; font-size: 12px; color: var(--text-secondary);">Brak nowych powiadomień.</div>`;
        } else {
          notifList.innerHTML = urgentOrOverdue.map(t => `
            <div class="notification-item unread" data-ticket-id="${t.id}">
              <div class="notification-item-title">
                ${isOverdue(t) ? "⚠️ Przekroczenie SLA:" : "🔥 Sprawa PILNA:"} ${t.id}
              </div>
              <div style="font-size: 11px; color: var(--text-secondary);">
                ${t.city}, ${t.street} ${t.houseNumber} (${t.type})
              </div>
              <div class="notification-item-time">${t.timestamp}</div>
            </div>
          `).join("");

          notifList.querySelectorAll(".notification-item").forEach(item => {
            item.onclick = () => {
              const tid = item.getAttribute("data-ticket-id");
              this.notifOpen = false;
              this.updateDropdown();
              this.router.navigate("detail", { id: tid });
            };
          });
        }
      }
    } catch (e) {
      console.warn("Błąd ładowania powiadomień:", e);
    }
  }

  toggleNotifications() {
    this.notifOpen = !this.notifOpen;
    this.updateDropdown();
  }

  updateDropdown() {
    const dropdown = this.container.querySelector("#notif-dropdown");
    if (dropdown) {
      dropdown.classList.toggle("show", this.notifOpen);
    }
  }

  render() {
    this.container.className = "app-topbar";
    this.container.innerHTML = `
      <div class="topbar-left">
        <div class="global-search-wrapper">
          <i data-lucide="search" class="global-search-icon"></i>
          <input type="text" 
                 id="global-search-input" 
                 class="global-search-input" 
                 placeholder="Szukaj zgłoszenia (nr ELW, nazwisko, ulica, telefon, opis)..." 
                 autocomplete="off" />
        </div>
      </div>

      <div class="topbar-right">
        <!-- Status połączenia i tryb pracy -->
        <div class="system-status-indicator" id="system-status-btn" style="cursor: pointer;" title="Kliknij, aby otworzyć panel diagnostyki">
          <span class="status-dot" id="system-status-dot"></span>
          <span id="system-status-label">Ładowanie...</span>
        </div>

        <!-- Przycisk ręcznego odświeżenia danych -->
        <button class="btn btn-secondary btn-xs" id="btn-manual-sync" style="display: flex; align-items: center; gap: 4px; padding: 6px 10px;" title="Ręczne odświeżenie danych z CRM">
          <i data-lucide="refresh-cw" style="width: 13px; height: 13px;"></i>
          <span style="font-size: 11px;">Odśwież</span>
        </button>

        <!-- Centrum Powiadomień -->
        <div style="position: relative;">
          <button class="notifications-btn" id="notif-toggle-btn" title="Centrum powiadomień">
            <i data-lucide="bell" style="width: 18px; height: 18px;"></i>
            <span class="notifications-badge" id="notif-badge" style="display: none;">0</span>
          </button>

          <div class="notifications-dropdown" id="notif-dropdown">
            <div class="notifications-header">
              <span>Powiadomienia operacyjne</span>
              <span style="font-size: 11px; font-weight: normal; color: var(--text-secondary);">Pilne i SLA</span>
            </div>
            <div class="notifications-list" id="notif-list">
              <!-- Renderowane dynamicznie -->
            </div>
          </div>
        </div>

        <!-- Profil pracownika -->
        <div class="user-profile-menu" id="user-profile-btn" title="Zmień profil aktywnego pracownika">
          <div class="user-avatar" id="topbar-user-avatar">AN</div>
          <div class="user-info">
            <span class="user-name" id="topbar-user-name">Anna Nowak</span>
            <span class="user-role" id="topbar-user-role">Dyspozytor Główny</span>
          </div>
          <i data-lucide="chevron-down" style="width: 14px; height: 14px; color: var(--text-secondary);"></i>
        </div>
      </div>
    `;

    // Obsługa wyszukiwarki
    const searchInput = this.container.querySelector("#global-search-input");
    searchInput.onkeydown = (e) => {
      if (e.key === "Enter") {
        const query = searchInput.value.trim();
        this.router.navigate("tickets", { search: query });
      }
    };

    // Obsługa statusu
    const statusBtn = this.container.querySelector("#system-status-btn");
    statusBtn.onclick = () => this.router.navigate("diagnostics");

    // Obsługa ręcznego odświeżenia
    const syncBtn = this.container.querySelector("#btn-manual-sync");
    if (syncBtn) {
      syncBtn.onclick = async () => {
        syncBtn.disabled = true;
        try {
          if (typeof this.dataProvider.notify === "function") this.dataProvider.notify();
          await this.loadNotifications();
          this.updateSystemStatus();
          this.router.refreshCurrent();
          Promise.resolve({ Toast }).then(({ Toast }) => Toast.success("Dane zostały zsynchronizowane."));
        } catch (err) {
          Promise.resolve({ Toast }).then(({ Toast }) => Toast.error("Błąd odświeżania: " + err.message));
        } finally {
          syncBtn.disabled = false;
        }
      };
    }

    // Obsługa powiadomień
    const notifBtn = this.container.querySelector("#notif-toggle-btn");
    notifBtn.onclick = (e) => {
      e.stopPropagation();
      this.toggleNotifications();
    };

    document.addEventListener("click", (e) => {
      if (this.notifOpen && !this.container.querySelector("#notif-dropdown").contains(e.target) && e.target !== notifBtn) {
        this.notifOpen = false;
        this.updateDropdown();
      }
    });

    // Przełącznik pracownika
    const profileBtn = this.container.querySelector("#user-profile-btn");
    profileBtn.onclick = () => this.showStaffSwitchModal();

    if (window.lucide) {
      window.lucide.createIcons({ root: this.container });
    }

    this.loadStaff();
    this.loadNotifications();
    this.updateSystemStatus();
  }

  updateSystemStatus() {
    const dot = this.container.querySelector("#system-status-dot");
    const label = this.container.querySelector("#system-status-label");
    if (!dot || !label) return;

    const isConnected = Boolean(this.dataProvider && (this.dataProvider.isEmbeddedGas || (this.dataProvider.constructor && this.dataProvider.constructor.name === "AppsScriptDataProvider")));
    if (isConnected) {
      dot.className = "status-dot";
      label.textContent = "Połączono z CRM (Google Sheets)";
    } else {
      dot.className = "status-dot dot-warning";
      label.textContent = "Tryb DEMO (30 zgłoszeń)";
    }
  }

  showStaffSwitchModal() {
    const listHtml = this.staffList.map(s => `
      <div class="staff-select-card" data-staff-id="${s.id}" style="
        display: flex; align-items: center; justify-content: space-between;
        padding: 12px 16px; border: 1px solid var(--border-color); border-radius: var(--radius-sm);
        margin-bottom: 8px; cursor: pointer; transition: all 0.15s ease;
      ">
        <div style="display: flex; align-items: center; gap: 12px;">
          <div style="
            width: 36px; height: 36px; border-radius: 4px; background-color: var(--brand-navy);
            color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 600;
          ">${s.name.split(" ").map(n => n[0]).join("")}</div>
          <div>
            <div style="font-weight: 600; font-size: 13px;">${s.name}</div>
            <div style="font-size: 11px; color: var(--text-secondary);">${s.role} • ${s.email}</div>
          </div>
        </div>
        ${this.state.currentUser && this.state.currentUser.id === s.id ? '<span class="badge badge-ai-przeanalizowano">Aktywny</span>' : ''}
      </div>
    `).join("");

    Promise.resolve({ Modal }).then(({ Modal }) => {
      const modal = new Modal({
        title: "Wybierz aktywnego pracownika",
        size: "sm",
        content: `
          <p style="font-size: 12px; color: var(--text-secondary); margin-bottom: 12px;">
            Wybór pracownika symuluje zalogowanego użytkownika w kolejce "Moje zadania" oraz przy podpisie korespondencji.
          </p>
          <div>${listHtml}</div>
        `
      });

      modal.element.querySelectorAll(".staff-select-card").forEach(card => {
        card.onmouseenter = () => { card.style.backgroundColor = "var(--bg-muted)"; card.style.borderColor = "var(--brand-navy)"; };
        card.onmouseleave = () => { card.style.backgroundColor = ""; card.style.borderColor = "var(--border-color)"; };
        card.onclick = () => {
          const sid = card.getAttribute("data-staff-id");
          const selected = this.staffList.find(s => s.id === sid);
          if (selected) {
            this.state.currentUser = selected;
            this.renderStaffSelector();
            modal.close();
            Promise.resolve({ Toast }).then(({ Toast }) => {
              Toast.success(`Przełączono profil na: ${selected.name}`);
            });
            this.router.refreshCurrent();
          }
        };
      });

      modal.open();
    });
  }
}

          <div class="card-header">

            </div>

            </div>

          <div class="card-header">
            <div class="card-title">
              <i data-lucide="check-circle-2" style="width: 16px; height: 16px;"></i>
              <span>Zgłoszenia rozwiązane a nowe</span>
            </div>
          </div>
          <div class="card-body">
            <div class="chart-container">
              <canvas id="chart-resolved-vs-new"></canvas>
            </div>
          </div>
        </div>

        <!-- 6. Satysfakcja w czasie -->
        <div class="card chart-card chart-wide">
          <div class="card-header">
            <div class="card-title">
              <i data-lucide="smile" style="width: 16px; height: 16px;"></i>

        const period = btn.getAttribute("data-period");

        periodBtns.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");

        const rangeInputs = this.container.querySelector("#custom-range-inputs");
        if (period === "custom") {
          rangeInputs.style.display = "flex";
        } else {
          rangeInputs.style.display = "none";
          this.loadData();
        }
      };

        this.loadData();
      };

          metricKey: "urgent",
          period: this.currentPeriod

        if (this.currentPeriod === "custom" && this.customRange) {

          navParams.to = this.customRange.to;

        this.router.navigate("tickets", navParams);

    this.renderTopUrgent(stats.topUrgent);
    this.renderCharts(stats);

    if (window.lucide) {
      window.lucide.createIcons({ root: this.container });
    }
  }

  renderKpis(s) {
    const kpis = [
      { key: "all", title: "Wszystkie zgłoszenia", val: s.total, icon: "inbox", hint: "Zobacz całą bazę", colorClass: "" },
      { key: "new", title: "Nowe zgłoszenia", val: s.newCount, icon: "sparkles", hint: "Oczekują na dyspozycję", colorClass: s.newCount > 0 ? "kpi-warning" : "" },

      { key: "urgent", title: "Pilny kontakt", val: s.urgent, icon: "alert-triangle", hint: "Najwyższy priorytet", colorClass: s.urgent > 0 ? "kpi-urgent" : "" },
      { key: "overdue", title: "Przeterminowane (SLA)", val: s.overdue, icon: "clock", hint: "Przekroczone terminy", colorClass: s.overdue > 0 ? "kpi-urgent" : "" },
      { key: "today", title: "Zadania na dzisiaj", val: s.dueToday, icon: "calendar", hint: "Termin mija dziś", colorClass: "" },
      { key: "no_step", title: "Bez kolejnego kroku", val: s.noNextStep, icon: "alert-octagon", hint: "Wymagają zaplanowania", colorClass: s.noNextStep > 0 ? "kpi-urgent" : "" },
      { key: "awaiting_citizen", title: "Oczekuje na mieszkańca", val: s.awaitingCitizen, icon: "user-check", hint: "Prośba o dane/posesję", colorClass: "" },
      { key: "awaiting_company", title: "Oczekuje na firmę", val: s.awaitingCompany, icon: "truck", hint: "Działania operacyjne ELWOZ", colorClass: "" },
      { key: "resolved", title: "Sprawy rozwiązane", val: s.resolved, icon: "check-circle", hint: "Zakończone sukcesem", colorClass: "kpi-success" },
      { key: "resolved", title: "Wskaźnik rozwiązań", val: s.resolutionRate !== "-" ? `${s.resolutionRate}%` : "-", icon: "percent", hint: "Efektywność zamykania", colorClass: "kpi-success" },
      { key: "all", title: "Śr. czas 1. reakcji", val: s.avgFirstResponseFormatted, icon: "timer", hint: "Od wpłynięcia do kontaktu", colorClass: "" },
      { key: "resolved", title: "Śr. czas rozwiązania", val: s.avgResolutionFormatted, icon: "check-check", hint: "Pełny cykl obsługi", colorClass: "" },
      { key: "rated", title: "Średnia satysfakcja", val: s.avgSatisfactionFormatted !== "-" ? `${s.avgSatisfactionFormatted} ★` : "-", icon: "star", hint: "Oceny mieszkańców (1–5)", colorClass: "kpi-success" },
      { key: "rated", title: "Zebrane oceny", val: s.feedbackCount, icon: "thumbs-up", hint: "Liczba ankiet powrotnych", colorClass: "" },
      { key: "review_invites", title: "Zaproszenia do opinii", val: s.reviewInvitesCount, icon: "share-2", hint: "Wizytówka Google Reviews", colorClass: "" }
    ];

    const kpiGrid = this.container.querySelector("#kpi-grid");
    kpiGrid.innerHTML = kpis.map(k => `
      <div class="kpi-card ${k.colorClass}" data-metric="${k.key}" title="Kliknij, aby przefiltrować listę zgłoszeń">
        <div class="kpi-header">
          <span class="kpi-title">${k.title}</span>
          <i data-lucide="${k.icon}" class="kpi-icon"></i>
        </div>
        <div class="kpi-value-row">
          <div class="kpi-value">${k.val}</div>
        </div>
        <div class="kpi-hint">
          <span>${k.hint}</span>
          <i data-lucide="arrow-right" style="width: 12px; height: 12px;"></i>
        </div>
      </div>
    `).join("");

    kpiGrid.querySelectorAll(".kpi-card").forEach(card => {
      card.onclick = () => {
        const metric = card.getAttribute("data-metric");
        const navParams = { 
          metricKey: metric,
          period: this.currentPeriod
        };
        if (this.currentPeriod === "custom" && this.customRange) {
          navParams.from = this.customRange.from;
          navParams.to = this.customRange.to;
        }
        this.router.navigate("tickets", navParams);
      };
    });
  }

  renderTopUrgent(tickets) {
    const tbody = this.container.querySelector("#top-urgent-tbody");
    if (!tickets || tickets.length === 0) {
      tbody.innerHTML = `<tr><td colspan="8" style="text-align: center; color: var(--text-secondary); padding: 20px;">Brak spraw wymagających natychmiastowego działania. Świetna robota!</td></tr>`;
      return;
    }

    tbody.innerHTML = tickets.map(t => `
      <tr class="row-clickable ${t.priority === 'PILNY' ? 'row-urgent' : ''}" data-ticket-id="${t.id}">
        <td class="table-ticket-id">${t.id}</td>
        <td>
          <div style="font-weight: 600;">${t.city}</div>
          <div style="font-size: 11px; color: var(--text-secondary);">${t.street} ${t.houseNumber || '(brak nr)'}</div>
        </td>
        <td>
          <div>${t.type}</div>
          <div style="font-size: 11px; color: var(--text-secondary);">${t.fraction}</div>
        </td>
        <td>
          <span class="badge badge-prio-${t.priority.toLowerCase()}">${t.priority}</span>
        </td>
        <td>
          ${((t.slaDeadline && new Date(t.slaDeadline) < new Date()) || (t.nextActionDeadline && new Date(t.nextActionDeadline) < new Date()))
            ? '<span class="badge badge-prio-pilny">⚠️ Przekroczone SLA</span>' 
            : `<span style="font-size: 11px; color: var(--text-secondary);">${t.slaDeadline ? 'Do: ' + t.slaDeadline.substring(11, 16) : 'Brak terminu'}</span>`}
        </td>
        <td>${t.assignee || 'Nieprzypisany'}</td>
        <td style="max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
          ${t.nextAction || '<span style="color: var(--prio-urgent); font-weight: 600;">Brak kolejnego kroku!</span>'}
        </td>
        <td style="text-align: right;">
          <button class="btn btn-navy btn-xs btn-open-detail" data-ticket-id="${t.id}">Otwórz</button>
        </td>
      </tr>
    `).join("");

    tbody.querySelectorAll(".row-clickable").forEach(row => {
      row.onclick = (e) => {
        const tid = row.getAttribute("data-ticket-id");
        this.router.navigate("detail", { id: tid });
      };
    });
  }

  destroyCharts() {
    Object.keys(this.charts).forEach(key => {
      if (this.charts[key]) {
        this.charts[key].destroy();
        delete this.charts[key];
      }
    });
  }

  renderCharts(s) {
    if (typeof Chart === "undefined") {
      console.warn("Chart.js nie jest załadowany.");
      return;
    }

    this.destroyCharts();

    const brandNavy = "#252D72";
    const brandGreen = "#6BAA43";
    const prioUrgent = "#B42318";
    const prioHigh = "#B54708";
    const prioLow = "#376522";

    // 1. Liczba zgłoszeń w czasie
    const ctxTrend = this.container.querySelector("#chart-time-trend");
    if (ctxTrend) {
      this.charts.trend = new Chart(ctxTrend, {
        type: "line",
        data: {
          labels: s.trendLabels.length > 0 ? s.trendLabels : ["Brak danych"],
          datasets: [{
            label: "Nowe zgłoszenia",
            data: s.trendValues.length > 0 ? s.trendValues : [0],
            borderColor: brandNavy,
            backgroundColor: "rgba(37, 45, 114, 0.08)",
            tension: 0.3,
            fill: true,
            pointBackgroundColor: brandNavy,
            pointRadius: 4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            y: { beginAtZero: true, ticks: { precision: 0 } },
            x: { grid: { display: false } }
          }
        }
      });
    }

    // 2. Kategorie
    const ctxCat = this.container.querySelector("#chart-categories");
    if (ctxCat) {
      const catLabels = Object.keys(s.categoryMap);
      const catValues = Object.values(s.categoryMap);
      this.charts.cat = new Chart(ctxCat, {
        type: "doughnut",
        data: {
          labels: catLabels,
          datasets: [{
            data: catValues,
            backgroundColor: [brandNavy, brandGreen, "#F59E0B", "#10B981", "#6366F1", "#84CC16", "#EC4899"]
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { position: "right", labels: { boxWidth: 12, font: { size: 11 } } }
          }
        }
      });
    }

    // 3. Statusy
    const ctxStatus = this.container.querySelector("#chart-statuses");
    if (ctxStatus) {
      this.charts.status = new Chart(ctxStatus, {
        type: "bar",
        data: {
          labels: Object.keys(s.statusMap),
          datasets: [{
            label: "Liczba spraw",
            data: Object.values(s.statusMap),
            backgroundColor: ["#0284C7", "#D97706", "#4B5563", "#DC2626", brandGreen],

          }]

        options: {
          responsive: true,

          plugins: { legend: { display: false } },
          scales: {
            y: { beginAtZero: true, ticks: { precision: 0 } }
          }
        }
      });
    }

    // 4. Priorytety
    const ctxPrio = this.container.querySelector("#chart-priorities");
    if (ctxPrio) {
      this.charts.prio = new Chart(ctxPrio, {
        type: "bar",
        data: {
          labels: ["PILNY", "WYSOKI", "STANDARDOWY", "NISKI"],
          datasets: [{
            data: [s.priorityMap.PILNY || 0, s.priorityMap.WYSOKI || 0, s.priorityMap.STANDARDOWY || 0, s.priorityMap.NISKI || 0],
            backgroundColor: [prioUrgent, prioHigh, brandNavy, prioLow],
            borderRadius: 4
          }]
        },
        options: {
          indexAxis: "y",
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { beginAtZero: true, ticks: { precision: 0 } }
          }
        }
      });
    }

    // 5. Rozwiązane vs Nowe
    const ctxRes = this.container.querySelector("#chart-resolved-vs-new");
    if (ctxRes) {
      this.charts.res = new Chart(ctxRes, {
        type: "bar",
        data: {
          labels: ["Wszystkie zgłoszenia", "W toku", "Rozwiązane"],
          datasets: [{

            backgroundColor: [brandNavy, "#F59E0B", brandGreen],
            borderRadius: 4
          }]

        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            y: { beginAtZero: true, ticks: { precision: 0 } }
          }
        }
      });
    }

    // 6. Satysfakcja
    const ctxCsat = this.container.querySelector("#chart-csat");
    if (ctxCsat) {
      this.charts.csat = new Chart(ctxCsat, {
        type: "bar",
        data: {
          labels: ["1 ★ (Bardzo źle)", "2 ★ (Źle)", "3 ★ (Średnio)", "4 ★ (Dobrze)", "5 ★ (Wzorowo)"],
          datasets: [{
            label: "Liczba ocen mieszkańców",
            data: [s.csatDistribution[1], s.csatDistribution[2], s.csatDistribution[3], s.csatDistribution[4], s.csatDistribution[5]],
            backgroundColor: [prioUrgent, "#F97316", "#FBBF24", "#84CC16", brandGreen],
            borderRadius: 4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {

        const form = modal.element.querySelector("#new-ticket-form");
        if (!form.checkValidity()) {
          form.reportValidity();
          return;

        const newTicketData = {

        });
        this.loadData();
      };

      modal.open();
    });
  }

/**
 * ELWOZ ECO SmartCare Manager v0.3.0
 * Tasks View (Moje zadania – Operacyjna Kolejka CRM)

class TasksView {
  constructor(container, router, dataProvider, state) {
    this.container = container;
    this.router = router;
    this.dataProvider = dataProvider;
    this.state = state;
    this.activeQueue = "immediate"; // immediate, overdue, today, scheduled, awaiting_citizen, unassigned, no_step
    this.filterOnlyMine = false;
  }

  async render() {
    const currentUserName = this.state.currentUser ? this.state.currentUser.name : "Anna Nowak";

    this.container.innerHTML = `
      <div class="view-header">
        <div class="view-title-group">
          <h1 class="view-title">Moje zadania – Kolejka operacyjna</h1>
          <div class="view-description">Bieżący rejestr spraw wg pilności i terminów wykonania • Aktywny pracownik: <strong>${currentUserName}</strong></div>
        </div>
        <div class="view-actions">
          <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; cursor: pointer; user-select: none;">
            <input type="checkbox" id="toggle-only-mine" ${this.filterOnlyMine ? 'checked' : ''} style="width: 16px; height: 16px; accent-color: var(--brand-navy);" />
            <span>Tylko moje zadania (${currentUserName})</span>
          </label>
        </div>
      </div>

      <!-- Zakładki kolejek operacyjnych -->
      <div class="card" style="margin-bottom: 20px;">
        <div class="tab-nav" id="tasks-tab-nav" style="overflow-x: auto;">
          <button class="tab-btn ${this.activeQueue === 'immediate' ? 'active' : ''}" data-queue="immediate">
            <i data-lucide="flame" style="width: 15px; height: 15px; color: var(--prio-urgent);"></i>
            <span>Natychmiastowa reakcja</span>
            <span class="tab-badge" id="tab-badge-immediate">0</span>
          </button>

          <button class="tab-btn ${this.activeQueue === 'overdue' ? 'active' : ''}" data-queue="overdue">
            <i data-lucide="clock" style="width: 15px; height: 15px; color: var(--prio-urgent);"></i>
            <span>Przeterminowane</span>
            <span class="tab-badge" id="tab-badge-overdue">0</span>
          </button>

          <button class="tab-btn ${this.activeQueue === 'today' ? 'active' : ''}" data-queue="today">
            <i data-lucide="calendar" style="width: 15px; height: 15px; color: var(--brand-navy);"></i>
            <span>Do zrobienia dzisiaj</span>
            <span class="tab-badge" id="tab-badge-today">0</span>
          </button>

          <button class="tab-btn ${this.activeQueue === 'scheduled' ? 'active' : ''}" data-queue="scheduled">
            <i data-lucide="calendar-check" style="width: 15px; height: 15px; color: var(--brand-green);"></i>
            <span>Zaplanowane</span>
            <span class="tab-badge" id="tab-badge-scheduled">0</span>
          </button>

          <button class="tab-btn ${this.activeQueue === 'awaiting_citizen' ? 'active' : ''}" data-queue="awaiting_citizen">
            <i data-lucide="user-check" style="width: 15px; height: 15px; color: var(--prio-high);"></i>
            <span>Oczekujące na mieszkańca</span>
            <span class="tab-badge" id="tab-badge-citizen">0</span>
          </button>

          <button class="tab-btn ${this.activeQueue === 'unassigned' ? 'active' : ''}" data-queue="unassigned">
            <i data-lucide="user-x" style="width: 15px; height: 15px; color: var(--text-secondary);"></i>
            <span>Bez opiekuna</span>
            <span class="tab-badge" id="tab-badge-unassigned">0</span>
          </button>

          <button class="tab-btn ${this.activeQueue === 'no_step' ? 'active' : ''}" data-queue="no_step">
            <i data-lucide="alert-octagon" style="width: 15px; height: 15px; color: var(--prio-urgent);"></i>
            <span>Bez kolejnego kroku</span>
            <span class="tab-badge" id="tab-badge-no-step">0</span>
          </button>
        </div>

        <div class="card-body" style="padding: 0;">
          <div class="table-container" style="border: none; border-radius: 0;">
            <table class="data-table">
              <thead>
                <tr>
                  <th>ID Zgłoszenia</th>
                  <th>Miejscowość / Adres</th>
                  <th>Kategoria i Frakcja</th>
                  <th>Priorytet</th>
                  <th>Czas oczekiwania / SLA</th>
                  <th>Pracownik</th>
                  <th>Następne działanie</th>
                  <th>Termin działania</th>
                  <th style="text-align: right;">Akcja</th>
                </tr>
              </thead>
              <tbody id="tasks-table-body">
                <tr><td colspan="9" style="text-align: center; padding: 24px;">Ładowanie zadań...</td></tr>

    `;

    this.bindEvents();
    await this.loadTasks();

    if (window.lucide) {
      window.lucide.createIcons({ root: this.container });
    }
  }

  bindEvents() {
    const tabs = this.container.querySelectorAll(".tab-btn");
    tabs.forEach(tab => {
      tab.onclick = () => {
        tabs.forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        this.activeQueue = tab.getAttribute("data-queue");
        this.loadTasks();
      };
    });

    const toggleMine = this.container.querySelector("#toggle-only-mine");
    if (toggleMine) {
      toggleMine.onchange = () => {
        this.filterOnlyMine = toggleMine.checked;
        this.loadTasks();
      };
    }
  }

  async loadTasks() {
    let tickets = await this.dataProvider.getTickets();
    const currentUserName = this.state.currentUser ? this.state.currentUser.name : "Anna Nowak";

    // Wyklucz sprawy zakończone (Rozwiązane i Zamknięte)
    const isClosed = s => s === "Rozwiązane" || s === "Zamknięte";
    const openTickets = tickets.filter(t => !isClosed(t.status));

    const now = new Date();
    const todayStr = now.toISOString().split("T")[0];

    // Dynamiczny sprawdzian SLA bez opierania się na historycznej fladze
    // Zgłoszenie z udzieloną odpowiedzią NIE JEST oznaczane jako zalegające z 1. reakcją
    const isOverdueCheck = t => {
      const hasFirst = Boolean(t.hasFirstContact || t.firstContactDate);
      const isFirstOverdue = !hasFirst && Boolean(t.slaDeadline && new Date(t.slaDeadline) < now);
      const isNextOverdue = Boolean(t.nextActionDeadline && new Date(t.nextActionDeadline) < now);
      return isFirstOverdue || isNextOverdue;
    };

    // Oblicz liczebności zakładek
    const counts = {
      immediate: openTickets.filter(t => t.priority === "PILNY" || t.status === "Nowe").length,
      overdue: openTickets.filter(isOverdueCheck).length,
      today: openTickets.filter(t => t.nextActionDeadline && t.nextActionDeadline.startsWith(todayStr)).length,
      scheduled: openTickets.filter(t => t.nextActionDeadline && new Date(t.nextActionDeadline) > now && !t.nextActionDeadline.startsWith(todayStr)).length,
      awaiting_citizen: openTickets.filter(t => t.responsibleSide === "Mieszkaniec").length,
      unassigned: openTickets.filter(t => !t.assignee || t.assignee === "Nieprzypisany").length,
      no_step: openTickets.filter(t => !t.nextAction || t.nextAction.trim() === "").length
    };

    const setBadge = (id, val) => {
      const el = this.container.querySelector(id);
      if (el) el.textContent = val;
    };
    setBadge("#tab-badge-immediate", counts.immediate);
    setBadge("#tab-badge-overdue", counts.overdue);
    setBadge("#tab-badge-today", counts.today);
    setBadge("#tab-badge-scheduled", counts.scheduled);
    setBadge("#tab-badge-citizen", counts.awaiting_citizen);
    setBadge("#tab-badge-unassigned", counts.unassigned);
    setBadge("#tab-badge-no-step", counts.no_step);

    // Filtrowanie wybranej kolejki
    let filtered = [];
    switch (this.activeQueue) {
      case "immediate":
        filtered = openTickets.filter(t => t.priority === "PILNY" || t.status === "Nowe");
        break;
      case "overdue":
        filtered = openTickets.filter(isOverdueCheck);
        break;
      case "today":
        filtered = openTickets.filter(t => t.nextActionDeadline && t.nextActionDeadline.startsWith(todayStr));
        break;
      case "scheduled":
        filtered = openTickets.filter(t => t.nextActionDeadline && new Date(t.nextActionDeadline) > now && !t.nextActionDeadline.startsWith(todayStr));
        break;
      case "awaiting_citizen":
        filtered = openTickets.filter(t => t.responsibleSide === "Mieszkaniec");
        break;
      case "unassigned":
        filtered = openTickets.filter(t => !t.assignee || t.assignee === "Nieprzypisany");
        break;
      case "no_step":
        filtered = openTickets.filter(t => !t.nextAction || t.nextAction.trim() === "");
        break;
    }

    if (this.filterOnlyMine) {
      filtered = filtered.filter(t => t.assignee === currentUserName);
    }

    // Sortowanie: Pilne pierwsze, potem przeterminowane
    filtered.sort((a, b) => {
      const pOrder = { "PILNY": 4, "WYSOKI": 3, "STANDARDOWY": 2, "NISKI": 1 };
      const diff = (pOrder[b.priority] || 0) - (pOrder[a.priority] || 0);
      if (diff !== 0) return diff;
      return new Date(a.timestamp || 0) - new Date(b.timestamp || 0);
    });

    const tbody = this.container.querySelector("#tasks-table-body");
    if (filtered.length === 0) {
      tbody.innerHTML = `
        <tr>
          <td colspan="9">
            <div class="empty-state">
              <i data-lucide="check-circle" class="empty-state-icon" style="color: var(--brand-green);"></i>
              <div class="empty-state-title">Kolejka jest pusta</div>
              <div class="empty-state-desc">Brak otwartych spraw w tej kategorii${this.filterOnlyMine ? ' przypisanych do Ciebie' : ''}.</div>
            </div>
          </td>
        </tr>
      `;
      if (window.lucide) window.lucide.createIcons({ root: tbody });
      return;
    }

    tbody.innerHTML = filtered.map(t => {
      const hasFirst = Boolean(t.hasFirstContact || t.firstContactDate);
      const isOverdue = (!hasFirst && t.slaDeadline && new Date(t.slaDeadline) < now) || (t.nextActionDeadline && new Date(t.nextActionDeadline) < now);
      const isMine = t.assignee === currentUserName;

      return `
        <tr class="row-clickable ${t.priority === 'PILNY' ? 'row-urgent' : ''}" data-ticket-id="${t.id}">
          <td class="table-ticket-id">${t.id}</td>
          <td>
            <div style="font-weight: 600;">${t.city}</div>
            <div style="font-size: 11px; color: var(--text-secondary);">${t.street} ${t.houseNumber || '(brak posesji)'}</div>
          </td>
          <td>
            <div>${t.type}</div>
            <span class="fraction-pill" style="margin-top: 2px;">
              <span class="fraction-dot fraction-${t.fraction.toLowerCase().split(' ')[0]}"></span>
              ${t.fraction}
            </span>
          </td>
          <td>
            <span class="badge badge-prio-${t.priority.toLowerCase()}">${t.priority}</span>
          </td>
          <td>
            ${isOverdue 
              ? '<span class="badge badge-prio-pilny">⚠️ Przekroczone!</span>' 
              : `<span style="font-size: 11px; color: var(--text-secondary);">SLA do: ${t.slaDeadline ? t.slaDeadline.substring(11, 16) : '-'}</span>`}
          </td>
          <td>
            <div style="font-weight: 500;">${t.assignee || '<span style="color: var(--prio-urgent);">Nieprzypisany</span>'}</div>
            ${!isMine ? `<button class="btn btn-secondary btn-xs btn-assign-me" data-ticket-id="${t.id}" style="margin-top: 4px;">Przypisz do mnie</button>` : ''}
          </td>
          <td style="max-width: 200px;">
            ${t.nextAction 
              ? `<div style="font-size: 12px; line-height: 1.3;">${t.nextAction}</div><div style="font-size: 10px; color: var(--text-secondary);">Strona: ${t.responsibleSide}</div>`
              : '<span class="badge badge-prio-pilny">Brak kolejnego kroku!</span>'}
          </td>
          <td>
            <div style="font-size: 12px; font-weight: 600; color: ${isOverdue ? 'var(--prio-urgent)' : 'var(--text-primary)'};">
              ${t.nextActionDeadline || '<span style="color: var(--text-muted); font-weight: normal;">Nie określono</span>'}
            </div>
          </td>
          <td style="text-align: right; white-space: nowrap;">
            <button class="btn btn-navy btn-xs btn-handle-ticket" data-ticket-id="${t.id}">Obsłuż sprawę</button>
          </td>
        </tr>
      `;
    }).join("");

    // Obsługa kliknięć
    tbody.querySelectorAll(".row-clickable").forEach(row => {
      row.onclick = (e) => {
        if (e.target.closest("button")) return;
        const tid = row.getAttribute("data-ticket-id");
        this.router.navigate("detail", { id: tid });
      };
    });

    tbody.querySelectorAll(".btn-handle-ticket").forEach(btn => {
      btn.onclick = (e) => {
        e.stopPropagation();
        const tid = btn.getAttribute("data-ticket-id");
        this.router.navigate("detail", { id: tid });
      };
    });

    tbody.querySelectorAll(".btn-assign-me").forEach(btn => {
      btn.onclick = async (e) => {
        e.stopPropagation();
        const tid = btn.getAttribute("data-ticket-id");
        await this.dataProvider.updateTicket(tid, { assignee: currentUserName });
        Promise.resolve({ Toast }).then(({ Toast }) => {
          Toast.success(`Przypisano zgłoszenie ${tid} do ${currentUserName}`);
        });
        this.loadTasks();
      };
    });

    if (window.lucide) {
      window.lucide.createIcons({ root: tbody });
    }
  }
}

/**
 * ELWOZ ECO SmartCare Manager v0.3.0
 * Tickets View (Wszystkie zgłoszenia – Kompaktowa tabela operacyjna)
 */

class TicketsView {
  constructor(container, router, dataProvider, state) {
    this.container = container;
    this.router = router;
    this.dataProvider = dataProvider;
    this.state = state;

    this.filters = {
      search: "",
      status: "all",
      priority: "all",
      category: "all",
      assignee: "all",
      aiState: "all",
      deadlineFilter: "all",
      sortField: "timestamp",
      sortOrder: "desc"
    };

    // Konfiguracja widoczności kolumn (domyślnie najważniejsze kolumny operacyjne)
    this.columnDefs = [
      { id: "id", label: "ID Zgłoszenia", default: true, required: true },
      { id: "timestamp", label: "Data zgłoszenia", default: true },
      { id: "location", label: "Miejscowość / Ulica", default: true },
      { id: "type", label: "Kategoria", default: true },
      { id: "fraction", label: "Frakcja", default: true },
      { id: "priority", label: "Priorytet", default: true },
      { id: "status", label: "Status", default: true },
      { id: "assignee", label: "Opiekun", default: true },
      { id: "nextAction", label: "Następne działanie", default: true },
      { id: "deadline", label: "Termin działania", default: true },
      { id: "aiState", label: "Stan AI", default: true },
      // Opcjonalne dodatkowe kolumny
      { id: "applicant", label: "Mieszkaniec (Dane)", default: false },
      { id: "contactRequest", label: "Prośba o kontakt", default: false },
      { id: "slaDeadline", label: "Termin SLA", default: false },
      { id: "satisfaction", label: "Ocena satysfakcji", default: false },
      { id: "reviewInvite", label: "Zaproszenie Google", default: false }
    ];

    this.visibleColumns = new Set(this.columnDefs.filter(c => c.default).map(c => c.id));
  }

  async render(params = {}) {
    if (params.search) this.filters.search = params.search;
    if (params.metricKey) this.filters.metricKey = params.metricKey;
    if (params.period) this.filters.period = params.period;
    if (params.from && params.to) {
      this.filters.customRange = { from: params.from, to: params.to };
      this.filters.period = "custom";
    } else if (params.customRange) {
      if (typeof params.customRange === "string") {
        try {
          this.filters.customRange = JSON.parse(params.customRange);
        } catch (_) {
          this.filters.customRange = null;
        }
      } else {
        this.filters.customRange = params.customRange;
      }
    }

    const staffList = await this.dataProvider.getStaff();

    this.container.innerHTML = `
      <div class="view-header">
        <div class="view-title-group">
          <h1 class="view-title">Wszystkie zgłoszenia</h1>
          <div class="view-description">Centralny rejestr CRM • Filtry wielokryterialne • Widok operacyjny</div>
        </div>
        <div class="view-actions">
          <button class="btn btn-secondary btn-sm" id="btn-toggle-columns">
            <i data-lucide="sliders-horizontal" style="width: 14px; height: 14px;"></i>
            <span>Widoczność kolumn</span>
          </button>
          <button class="btn btn-secondary btn-sm" id="btn-export-csv">
            <i data-lucide="download" style="width: 14px; height: 14px;"></i>
            <span>Eksport CSV</span>
          </button>
          <button class="btn btn-primary btn-sm" id="btn-new-ticket">
            <i data-lucide="plus" style="width: 16px; height: 16px;"></i>
            <span>Dodaj zgłoszenie</span>
          </button>
        </div>
      </div>

      <!-- Pasek filtrów wielokryterialnych -->
      <div class="card" style="margin-bottom: 16px; padding: 14px 16px;">
        <div style="display: grid; grid-template-columns: 2fr repeat(6, 1fr) auto; gap: 10px; align-items: end;">
          <div class="form-group" style="margin-bottom: 0;">
            <label class="form-label">Szukaj</label>
            <div class="input-group">
              <i data-lucide="search" class="input-icon" style="width: 15px; height: 15px;"></i>
              <input type="text" id="filter-search" class="form-control input-with-icon" 
                     placeholder="ID, nazwisko, adres, opis..." value="${this.filters.search || ''}" />
            </div>
          </div>

          <div class="form-group" style="margin-bottom: 0;">
            <label class="form-label">Status</label>
            <select class="form-select" id="filter-status">
              <option value="all">Wszystkie statusy</option>
              <option value="Nowe" ${this.filters.status === 'Nowe' ? 'selected' : ''}>Nowe</option>
              <option value="Do weryfikacji" ${this.filters.status === 'Do weryfikacji' ? 'selected' : ''}>Do weryfikacji</option>
              <option value="W realizacji" ${this.filters.status === 'W realizacji' ? 'selected' : ''}>W realizacji</option>
              <option value="Oczekuje na informacje" ${this.filters.status === 'Oczekuje na informacje' ? 'selected' : ''}>Oczekuje na informacje</option>
              <option value="Rozwiązane" ${this.filters.status === 'Rozwiązane' ? 'selected' : ''}>Rozwiązane</option>
              <option value="Zamknięte" ${this.filters.status === 'Zamknięte' ? 'selected' : ''}>Zamknięte</option>
            </select>
          </div>

          <div class="form-group" style="margin-bottom: 0;">
            <label class="form-label">Priorytet</label>
            <select class="form-select" id="filter-priority">
              <option value="all">Wszystkie priorytety</option>
              <option value="PILNY">PILNY</option>
              <option value="WYSOKI">WYSOKI</option>
              <option value="STANDARDOWY">STANDARDOWY</option>
              <option value="NISKI">NISKI</option>
            </select>
          </div>

          <div class="form-group" style="margin-bottom: 0;">
            <label class="form-label">Kategoria</label>
            <select class="form-select" id="filter-category">
              <option value="all">Wszystkie kategorie</option>
              <option value="Brak odbioru odpadów">Brak odbioru</option>
              <option value="Uszkodzony pojemnik">Uszkodzony pojemnik</option>
              <option value="Brak worków">Brak worków</option>
              <option value="Bałagan po odbiorze">Bałagan po odbiorze</option>
              <option value="Pochwała">Pochwała</option>
              <option value="Sugestia">Sugestia</option>
            </select>
          </div>

          <div class="form-group" style="margin-bottom: 0;">
            <label class="form-label">Opiekun</label>
            <select class="form-select" id="filter-assignee">
              <option value="all">Wszyscy pracownicy</option>
              <option value="Nieprzypisany">Nieprzypisany</option>
              ${staffList.map(s => `<option value="${s.name}">${s.name}</option>`).join("")}
            </select>
          </div>

          <div class="form-group" style="margin-bottom: 0;">
            <label class="form-label">Termin</label>
            <select class="form-select" id="filter-deadline">
              <option value="all">Wszystkie terminy</option>
              <option value="overdue">Przeterminowane (SLA)</option>
              <option value="today">Termin dzisiaj</option>
              <option value="no_step">Bez kolejnego kroku</option>
            </select>
          </div>

          <div class="form-group" style="margin-bottom: 0;">
            <label class="form-label">Stan analizy AI</label>
            <select class="form-select" id="filter-ai-state">
              <option value="all">Wszystkie stany</option>
              <option value="Przeanalizowano">Przeanalizowano</option>
              <option value="Wymaga weryfikacji">Wymaga weryfikacji</option>
              <option value="Błąd">Błąd analizy</option>
            </select>
          </div>

          <button class="btn btn-secondary btn-sm" id="btn-reset-filters" style="height: 38px;">
            <i data-lucide="rotate-ccw" style="width: 14px; height: 14px;"></i>
            <span>Reset</span>
          </button>
        </div>
      </div>

      <!-- Licznik wyników i aktywny filtr wskaźnika -->
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;">
        <div style="font-size: 13px; color: var(--text-secondary);" id="tickets-count-label">
          Ładowanie wyników...
        </div>
        <div id="active-metric-badge" style="display: none;"></div>
      </div>

      <!-- Tabela zgłoszeń -->
      <div class="table-container">
        <table class="data-table" id="tickets-table">
          <thead id="tickets-table-head">
            <!-- Dynamicznie wg widocznych kolumn -->
          </thead>
          <tbody id="tickets-table-body">
            <tr><td colspan="12" style="text-align: center; padding: 24px;">Ładowanie danych...</td></tr>
          </tbody>
        </table>
      </div>
    `;

    this.bindEvents();
    await this.loadTickets();

    if (window.lucide) {
      window.lucide.createIcons({ root: this.container });
    }
  }

  bindEvents() {
    // Filtry
    const searchInput = this.container.querySelector("#filter-search");
    let debounceTimer;
    searchInput.oninput = () => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        this.filters.search = searchInput.value;
        this.loadTickets();
      }, 300);
    };

    const statusSel = this.container.querySelector("#filter-status");
    statusSel.onchange = () => { this.filters.status = statusSel.value; this.loadTickets(); };

    const prioSel = this.container.querySelector("#filter-priority");
    prioSel.onchange = () => { this.filters.priority = prioSel.value; this.loadTickets(); };

    const catSel = this.container.querySelector("#filter-category");
    catSel.onchange = () => { this.filters.category = catSel.value; this.loadTickets(); };

    const assigneeSel = this.container.querySelector("#filter-assignee");
    assigneeSel.onchange = () => { this.filters.assignee = assigneeSel.value; this.loadTickets(); };

    const deadlineSel = this.container.querySelector("#filter-deadline");
    deadlineSel.onchange = () => { this.filters.deadlineFilter = deadlineSel.value; this.loadTickets(); };

    const aiSel = this.container.querySelector("#filter-ai-state");
    aiSel.onchange = () => { this.filters.aiState = aiSel.value; this.loadTickets(); };

    const resetBtn = this.container.querySelector("#btn-reset-filters");
    resetBtn.onclick = () => {
      this.filters = {
        search: "",
        status: "all",
        priority: "all",
        category: "all",
        assignee: "all",
        aiState: "all",
        deadlineFilter: "all",
        sortField: "timestamp",
        sortOrder: "desc"
      };
      this.render();
    };

    // Widoczność kolumn
    const toggleColsBtn = this.container.querySelector("#btn-toggle-columns");
    toggleColsBtn.onclick = () => this.showColumnVisibilityModal();

    // Eksport CSV
    const exportBtn = this.container.querySelector("#btn-export-csv");
    exportBtn.onclick = () => this.exportCsv();

    // Nowe zgłoszenie
    const newBtn = this.container.querySelector("#btn-new-ticket");
    newBtn.onclick = () => {
      Promise.resolve({ DashboardView }).then(({ DashboardView }) => {
        const dv = new DashboardView(this.container, this.router, this.dataProvider, this.state);
        dv.showNewTicketModal();
      });
    };
  }

  async loadTickets() {
    const tickets = await this.dataProvider.getTickets(this.filters);

    const countLabel = this.container.querySelector("#tickets-count-label");
    if (countLabel) {
      countLabel.textContent = `Wyświetlono: ${tickets.length} zgłoszeń`;
    }

    const metricBadge = this.container.querySelector("#active-metric-badge");
    if (metricBadge) {
      let badgesHtml = "";
      if (this.filters.metricKey) {
        badgesHtml += `
          <span class="badge badge-status-w-realizacji" style="margin-right: 6px;">
            Filtr wskaźnika: ${this.filters.metricKey}
            <button id="btn-clear-metric" style="background: none; border: none; cursor: pointer; margin-left: 4px; color: inherit;">&times;</button>
          </span>
        `;
      }
      if (this.filters.period === "custom" && this.filters.customRange && this.filters.customRange.from && this.filters.customRange.to) {
        badgesHtml += `
          <span class="badge badge-status-do-weryfikacji">
            Zakres dat: ${this.filters.customRange.from} do ${this.filters.customRange.to}
            <button id="btn-clear-range" style="background: none; border: none; cursor: pointer; margin-left: 4px; color: inherit;">&times;</button>
          </span>
        `;
      }

      if (badgesHtml) {
        metricBadge.style.display = "inline-flex";
        metricBadge.innerHTML = badgesHtml;
        const clearMetricBtn = metricBadge.querySelector("#btn-clear-metric");
        if (clearMetricBtn) {
          clearMetricBtn.onclick = () => {
            delete this.filters.metricKey;
            this.loadTickets();
          };
        }
        const clearRangeBtn = metricBadge.querySelector("#btn-clear-range");
        if (clearRangeBtn) {
          clearRangeBtn.onclick = () => {
            delete this.filters.period;
            delete this.filters.customRange;
            this.loadTickets();
          };
        }
      } else {
        metricBadge.style.display = "none";
      }
    }

    this.renderTableHeader();
    this.renderTableBody(tickets);

    if (window.lucide) {
      window.lucide.createIcons({ root: this.container });
    }
  }

  renderTableHeader() {
    const thead = this.container.querySelector("#tickets-table-head");
    let headersHtml = "<tr>";

    const isVis = id => this.visibleColumns.has(id);

    if (isVis("id")) headersHtml += `<th class="sortable" data-sort="id">ID ${this.getSortIcon("id")}</th>`;
    if (isVis("timestamp")) headersHtml += `<th class="sortable" data-sort="timestamp">Data zgłoszenia ${this.getSortIcon("timestamp")}</th>`;
    if (isVis("location")) headersHtml += `<th class="sortable" data-sort="city">Lokalizacja ${this.getSortIcon("city")}</th>`;
    if (isVis("type")) headersHtml += `<th class="sortable" data-sort="type">Kategoria ${this.getSortIcon("type")}</th>`;
    if (isVis("fraction")) headersHtml += `<th>Frakcja</th>`;
    if (isVis("priority")) headersHtml += `<th class="sortable" data-sort="priority">Priorytet ${this.getSortIcon("priority")}</th>`;
    if (isVis("status")) headersHtml += `<th class="sortable" data-sort="status">Status ${this.getSortIcon("status")}</th>`;
    if (isVis("assignee")) headersHtml += `<th class="sortable" data-sort="assignee">Opiekun ${this.getSortIcon("assignee")}</th>`;
    if (isVis("nextAction")) headersHtml += `<th>Następne działanie</th>`;
    if (isVis("deadline")) headersHtml += `<th class="sortable" data-sort="nextActionDeadline">Termin ${this.getSortIcon("nextActionDeadline")}</th>`;
    if (isVis("aiState")) headersHtml += `<th>Stan AI</th>`;

    // Opcjonalne
    if (isVis("applicant")) headersHtml += `<th>Mieszkaniec</th>`;
    if (isVis("contactRequest")) headersHtml += `<th>Kontakt</th>`;
    if (isVis("slaDeadline")) headersHtml += `<th>SLA Reakcji</th>`;
    if (isVis("satisfaction")) headersHtml += `<th>Ocena</th>`;
    if (isVis("reviewInvite")) headersHtml += `<th>Opinia Google</th>`;

    headersHtml += `<th style="text-align: right;">Akcja</th></tr>`;
    thead.innerHTML = headersHtml;

    // Obsługa sortowania
    thead.querySelectorAll("th.sortable").forEach(th => {
      th.onclick = () => {
        const field = th.getAttribute("data-sort");
        if (this.filters.sortField === field) {
          this.filters.sortOrder = this.filters.sortOrder === "asc" ? "desc" : "asc";
        } else {
          this.filters.sortField = field;
          this.filters.sortOrder = "asc";
        }
        this.loadTickets();
      };
    });
  }

  getSortIcon(field) {
    if (this.filters.sortField !== field) return "";
    return this.filters.sortOrder === "asc" ? "▲" : "▼";
  }

  renderTableBody(tickets) {
    const tbody = this.container.querySelector("#tickets-table-body");
    if (tickets.length === 0) {
      tbody.innerHTML = `
        <tr>
          <td colspan="15">
            <div class="empty-state">
              <i data-lucide="search-x" class="empty-state-icon"></i>
              <div class="empty-state-title">Brak pasujących zgłoszeń</div>
              <div class="empty-state-desc">Zmień parametry wyszukiwania lub zresetuj aktywne filtry.</div>
            </div>
          </td>
        </tr>
      `;
      return;
    }

    const isVis = id => this.visibleColumns.has(id);

    tbody.innerHTML = tickets.map(t => {
      const isUrgent = t.priority === "PILNY";
      let rowHtml = `<tr class="row-clickable ${isUrgent ? 'row-urgent' : ''}" data-ticket-id="${t.id}">`;

      if (isVis("id")) rowHtml += `<td class="table-ticket-id">${t.id}</td>`;
      if (isVis("timestamp")) rowHtml += `<td style="white-space: nowrap; font-size: 12px; color: var(--text-secondary);">${t.timestamp}</td>`;
      if (isVis("location")) {
        rowHtml += `
          <td>
            <div style="font-weight: 600;">${t.city}</div>
            <div style="font-size: 11px; color: var(--text-secondary);">${t.street} ${t.houseNumber || '(brak nr)'}</div>
          </td>
        `;
      }
      if (isVis("type")) rowHtml += `<td style="font-weight: 500;">${t.type}</td>`;
      if (isVis("fraction")) {
        rowHtml += `
          <td>
            <span class="fraction-pill">
              <span class="fraction-dot fraction-${t.fraction.toLowerCase().split(' ')[0]}"></span>
              ${t.fraction}
            </span>
          </td>
        `;
      }
      if (isVis("priority")) {
        rowHtml += `<td><span class="badge badge-prio-${t.priority.toLowerCase()}">${t.priority}</span></td>`;
      }
      if (isVis("status")) {
        const statusSlug = t.status.toLowerCase().replace(/\s+/g, '-');
        rowHtml += `<td><span class="badge badge-status-${statusSlug}">${t.status}</span></td>`;
      }
      if (isVis("assignee")) {
        rowHtml += `<td>${t.assignee || '<span style="color: var(--prio-urgent);">Nieprzypisany</span>'}</td>`;
      }
      if (isVis("nextAction")) {
        rowHtml += `
          <td style="max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" title="${t.nextAction || ''}">
            ${t.nextAction || '<span class="badge badge-prio-pilny">Brak kroku</span>'}
          </td>
        `;
      }
      if (isVis("deadline")) {
        rowHtml += `<td style="font-size: 12px; white-space: nowrap;">${t.nextActionDeadline || '-'}</td>`;
      }
      if (isVis("aiState")) {
        let aiBadgeClass = "badge-ai-przeanalizowano";
        if (t.aiState === "Wymaga weryfikacji") aiBadgeClass = "badge-ai-weryfikacja";
        if (t.aiState === "Błąd") aiBadgeClass = "badge-ai-blad";
        if (t.aiState === "Brak") aiBadgeClass = "badge-ai-brak";
        rowHtml += `<td><span class="badge ${aiBadgeClass}">${t.aiState || 'Brak'}</span></td>`;
      }

      // Opcjonalne
      if (isVis("applicant")) {
        rowHtml += `<td><div style="font-size: 12px; font-weight: 600;">${t.applicantName || '-'}</div><div style="font-size: 11px; color: var(--text-secondary);">${t.applicantPhone || ''}</div></td>`;
      }
      if (isVis("contactRequest")) {
        rowHtml += `<td><span class="badge ${t.contactRequest === 'TAK' ? 'badge-prio-wysoki' : 'badge-status-progress'}">${t.contactRequest}</span></td>`;
      }
      if (isVis("slaDeadline")) {
        rowHtml += `<td style="font-size: 12px;">${t.slaDeadline || '-'}</td>`;
      }
      if (isVis("satisfaction")) {
        rowHtml += `<td>${t.satisfactionScore ? `${t.satisfactionScore} ★` : '-'}</td>`;
      }
      if (isVis("reviewInvite")) {
        rowHtml += `<td>${t.reviewInviteSent === 'TAK' ? '<span class="badge badge-status-rozwiazane">Wysłano</span>' : 'NIE'}</td>`;
      }

      rowHtml += `
        <td style="text-align: right; white-space: nowrap;">
          <button class="btn btn-navy btn-xs btn-open-detail" data-ticket-id="${t.id}">Otwórz</button>
        </td>
      </tr>`;
      return rowHtml;
    }).join("");

    tbody.querySelectorAll(".row-clickable").forEach(row => {
      row.onclick = (e) => {
        if (e.target.closest("button")) return;
        const tid = row.getAttribute("data-ticket-id");
        this.router.navigate("detail", { id: tid });
      };
    });

    tbody.querySelectorAll(".btn-open-detail").forEach(btn => {
      btn.onclick = (e) => {
        e.stopPropagation();
        const tid = btn.getAttribute("data-ticket-id");
        this.router.navigate("detail", { id: tid });
      };
    });
  }

  showColumnVisibilityModal() {
    Promise.resolve({ Modal }).then(({ Modal }) => {
      const colItemsHtml = this.columnDefs.map(c => `
        <label style="display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: 13px; cursor: pointer;">
          <input type="checkbox" class="col-toggle-checkbox" data-col-id="${c.id}" 
                 ${this.visibleColumns.has(c.id) ? 'checked' : ''} 
                 ${c.required ? 'disabled' : ''} style="width: 16px; height: 16px; accent-color: var(--brand-navy);" />
          <span style="${c.required ? 'font-weight: 600;' : ''}">${c.label} ${c.required ? '(wymagana)' : ''}</span>
        </label>
      `).join("");

      const modal = new Modal({
        title: "Konfiguracja widoczności kolumn tabeli",
        size: "sm",
        content: `
          <p style="font-size: 12px; color: var(--text-secondary); margin-bottom: 12px;">
            Wybierz kolumny, które mają być prezentowane w widoku operacyjnym:
          </p>
          <div style="display: flex; flex-direction: column; max-height: 360px; overflow-y: auto;">
            ${colItemsHtml}
          </div>
        `,
        footer: `
          <button class="btn btn-secondary btn-sm" id="btn-col-default">Domyślne</button>
          <button class="btn btn-primary btn-sm" id="btn-col-save">Zastosuj</button>
        `
      });

      modal.element.querySelector("#btn-col-default").onclick = () => {
        this.visibleColumns = new Set(this.columnDefs.filter(c => c.default).map(c => c.id));
        modal.close();
        this.loadTickets();
      };

      modal.element.querySelector("#btn-col-save").onclick = () => {
        const checkboxes = modal.element.querySelectorAll(".col-toggle-checkbox");
        const newSet = new Set();
        checkboxes.forEach(cb => {
          if (cb.checked) newSet.add(cb.getAttribute("data-col-id"));
        });
        this.visibleColumns = newSet;
        modal.close();
        this.loadTickets();
      };

      modal.open();
    });
  }

  async exportCsv() {
    const tickets = await this.dataProvider.getTickets(this.filters);
    if (!tickets || tickets.length === 0) {
      Promise.resolve({ Toast }).then(({ Toast }) => Toast.warning("Brak danych do eksportu."));
      return;
    }

    const headers = [
      "ID Zgłoszenia", "Data zgłoszenia", "Kategoria", "Frakcja", "Miejscowość", "Ulica", "Numer posesji",
      "Status", "Priorytet", "Opiekun", "Następne działanie", "Termin działania", "Stan AI", "Ocena satysfakcji"
    ];

    const rows = tickets.map(t => [
      t.id,
      t.timestamp,
      t.type,
      t.fraction,
      t.city,
      t.street,
      t.houseNumber,
      t.status,
      t.priority,
      t.assignee,
      `"${(t.nextAction || '').replace(/"/g, '""')}"`,
      t.nextActionDeadline,
      t.aiState,
      t.satisfactionScore || ""
    ]);

    const disclaimer = "# DANE DEMONSTRACYJNE - ELWOZ ECO SMARTCARE MANAGER V0.3.0 (PROTOTYP EDUKACYJNY WSB MERITO)\n";
    const csvContent = disclaimer + [headers.join(";")].concat(rows.map(r => r.join(";"))).join("\r\n");

    const blob = new Blob(["\uFEFF" + csvContent], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `elwoz-smartcare-zgloszenia-${new Date().toISOString().split("T")[0]}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    Promise.resolve({ Toast }).then(({ Toast }) => {
      Toast.success(`Wyeksportowano ${tickets.length} zgłoszeń do pliku CSV.`);
    });
  }
}

      this.container.querySelector("#btn-back-tickets").onclick = () => this.router.navigate("tickets");
      return;
    }

    this.ticket = await this.dataProvider.getTicketById(this.ticketId);
    if (!this.ticket) {
      this.container.innerHTML = `
        <div class="empty-state">

    const nextTicket = currentIndex < allTickets.length - 1 ? allTickets[currentIndex + 1] : null;

    const currentUserName = this.state.currentUser ? this.state.currentUser.name : "Anna Nowak";

    // Wyliczenie SLA (dynamiczne, spójne z isClosedStatus i terminami)

    let slaDisplay = "Zgodne z normą";

    this.container.innerHTML = `

            </button>
            <button class="btn btn-secondary btn-xs" id="btn-next-ticket" ${!nextTicket ? 'disabled' : ''} title="Następne zgłoszenie">
              <span>Następne</span>

            </button>
          </div>
        </div>

        <!-- Główna siatka 3 paneli -->

                      <span>Zatwierdź i wyślij wiadomość</span>
