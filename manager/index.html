<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ELWOZ ECO SmartCare Manager v0.3.0 – Profesjonalna aplikacja webowa do zarządzania obsługą mieszkańców (Rejon Kartuzy)">
  <meta name="author" content="Uniwersytet WSB Merito w Gdańsku – Niezależny prototyp edukacyjny">
  <title>ELWOZ ECO SmartCare Manager v0.3.0</title>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">

  <!-- Style CSS (Central Design System) -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/detail.css">
  <link rel="stylesheet" href="css/responsive.css">

  <!-- Vendor Libraries: Chart.js & Lucide Icons -->
  <script src="vendor/chart.umd.js"></script>
  <script src="vendor/lucide.min.js"></script>
  <!-- Fallback CDN jeśli skrypty lokalne byłyby zablokowane -->
  <script>
    if (typeof Chart === 'undefined') {
      document.write('<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"><\/script>');
    }
    if (typeof lucide === 'undefined') {
      document.write('<script src="https://unpkg.com/lucide@latest"><\/script>');
    }
  </script>
</head>
<body>
  <!-- Główny kontener aplikacji SPA -->
  <div id="app">
    <!-- Pasek boczny nawigacji (230px zwijany) -->
    <aside id="sidebar-container"></aside>

    <!-- Główny obszar roboczy -->
    <div class="app-main">
      <!-- Górny pasek Topbar (64px) z wyszukiwarką, powiadomieniami i profilem -->
      <header id="topbar-container"></header>

      <!-- Dynamiczny obszar zawartości widoków -->
      <main id="content-container" class="app-content" role="main"></main>
    </div>
  </div>

  <!-- Aplikacja ES Modules -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
